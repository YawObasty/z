<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanaObasty | Premium Ghana Marketplace</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5; /* Royal Indigo */
            --secondary: #F43F5E; /* Rose Accent */
            --success: #10B981;
            --bg: #F8FAFC;
            --surface: #FFFFFF;
            --text: #0F172A;
            --muted: #64748B;
            --glass: rgba(255, 255, 255, 0.85);
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 90px; -webkit-tap-highlight-color: transparent; }

        /* --- MODERN HEADER --- */
        header {
            background: var(--glass); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 18px 6%; border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000;
        }
        .logo { font-size: 24px; font-weight: 800; letter-spacing: -1px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .logo span { color: var(--primary); }

        /* --- DYNAMIC SEARCH (BENTO STYLE) --- */
        .hero-banner { padding: 30px 6% 10px; }
        .search-wrap {
            background: var(--surface); padding: 6px 6px 6px 20px; border-radius: 18px;
            display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow);
            border: 1px solid rgba(0,0,0,0.02);
        }
        .search-wrap input { border: none; outline: none; width: 100%; font-size: 16px; font-weight: 500; }
        .search-btn { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 14px; cursor: pointer; }

        /* --- CATEGORY CHIPS --- */
        .categories { display: flex; gap: 10px; overflow-x: auto; padding: 15px 6%; scrollbar-width: none; }
        .categories::-webkit-scrollbar { display: none; }
        .chip { background: var(--surface); padding: 8px 18px; border-radius: 50px; font-size: 13px; font-weight: 600; white-space: nowrap; border: 1px solid rgba(0,0,0,0.05); cursor: pointer; }
        .chip.active { background: var(--text); color: white; }

        /* --- PRODUCT GRID --- */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 18px; padding: 10px 6%; }
        .card { 
            background: var(--surface); border-radius: 24px; overflow: hidden; 
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid rgba(0,0,0,0.03);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
        }
        .card:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .card-img { height: 160px; position: relative; overflow: hidden; }
        .card-img img { width: 100%; height: 100%; object-fit: cover; }
        .price-tag { position: absolute; bottom: 10px; left: 10px; background: var(--glass); padding: 4px 10px; border-radius: 10px; font-weight: 800; font-size: 14px; backdrop-filter: blur(5px); }

        /* --- FORMS --- */
        .view { display: none; padding: 20px 6%; animation: slideUp 0.4s ease; }
        .view.active { display: block; }
        @keyframes slideUp { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }

        .auth-card, .post-card { background: white; padding: 30px; border-radius: 28px; box-shadow: var(--shadow); max-width: 450px; margin: 0 auto; }
        input, select, textarea { width: 100%; padding: 16px; margin-bottom: 15px; border-radius: 16px; border: 1px solid #E2E8F0; background: #F8FAFC; outline: none; transition: 0.2s; }
        input:focus { border-color: var(--primary); background: white; }

        /* --- BOTTOM NAVIGATION --- */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; height: 75px; background: var(--glass);
            backdrop-filter: blur(20px); border-top: 1px solid rgba(0,0,0,0.05);
            display: flex; justify-content: space-around; align-items: center; z-index: 1000;
        }
        .nav-item { color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: var(--primary); }
        .nav-item svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2.5; }

        .btn-call { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="switchView('market')">Nana<span>Obasty</span></div>
        <div id="userProfile" onclick="switchView('auth')" style="cursor:pointer; background:#EEF2FF; padding:8px; border-radius:12px;">
            <svg style="width:20px; height:20px; stroke:var(--primary); fill:none; stroke-width:2;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
    </header>

    <section id="view-market" class="view active">
        <div class="hero-banner">
            <h1 style="font-size: 28px; font-weight: 800; margin-bottom: 20px;">Find exactly what<br>you need in <span style="color:var(--primary)">Ghana.</span></h1>
            <div class="search-wrap">
                <input type="text" placeholder="Search iPhones, Cars, Houses...">
                <button class="search-btn">Search</button>
            </div>
        </div>
        
        <div class="categories">
            <div class="chip active">All Items</div>
            <div class="chip">Electronics</div>
            <div class="chip">Vehicles</div>
            <div class="chip">Property</div>
            <div class="chip">Jobs</div>
        </div>

        <div class="grid" id="marketGrid">
            </div>
    </section>

    <section id="view-post" class="view">
        <div class="post-card">
            <h2 style="margin-bottom: 8px;">List your Item</h2>
            <p style="color:var(--muted); margin-bottom: 25px; font-size: 14px;">Reach

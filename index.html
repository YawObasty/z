<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanaObasty | The Gold Standard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366F1; --secondary: #EC4899; --accent: #00D094;
            --bg: #030712; --glass: rgba(17, 24, 39, 0.7);
            --border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: #fff; overflow-x: hidden; cursor: default; }

        /* --- Elite Background: Aurora & Mouse Spotlight --- */
        #spotlight {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(99, 102, 241, 0.15) 0%, transparent 40%);
            z-index: -1; pointer-events: none;
        }

        /* --- Floating Navigation --- */
        nav {
            position: sticky; top: 20px; margin: 0 5%;
            background: var(--glass); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 20px;
            padding: 15px 30px; display: flex; justify-content: space-between;
            align-items: center; z-index: 1000;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .logo { font-size: 1.6rem; font-weight: 800; letter-spacing: -1px; }
        .logo span { color: var(--primary); text-shadow: 0 0 15px var(--primary); }

        /* --- Aurora Header --- */
        .hero {
            padding: 100px 5% 60px; text-align: center;
            background: linear-gradient(180deg, rgba(99, 102, 241, 0.1) 0%, transparent 100%);
        }

        .hero h1 {
            font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: 800;
            line-height: 1; margin-bottom: 20px;
            background: linear-gradient(to bottom, #fff 40%, #6366f1);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* --- Premium Bento Cards --- */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; padding: 40px 5%; }

        .card {
            background: var(--glass); border-radius: 30px; border: 1px solid var(--border);
            padding: 20px; position: relative; overflow: hidden;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .card:hover {
            transform: translateY(-15px) scale(1.02);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }

        .card::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transition: 0.5s;
        }
        .card:hover::before { left: 100%; }

        .img-box {
            width: 100%; height: 240px; border-radius: 20px;
            overflow: hidden; margin-bottom: 20px;
        }
        .img-box img { width: 100%; height: 100%; object-fit: cover; transition: 0.8s; }
        .card:hover .img-box img { transform: scale(1.1) rotate(2deg); }

        /* --- Buttons with Shimmer --- */
        .btn-shimmer {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white; border: none; padding: 16px 32px; border-radius: 15px;
            font-weight: 700; cursor: pointer; position: relative; overflow: hidden;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .btn-shimmer::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg); animation: shimmer 3s infinite;
        }

        @keyframes shimmer { 0% { transform: translate(-100%, -100%) rotate(45deg); } 100% { transform: translate(100%, 100%) rotate(45deg); } }

        /* --- Floating Activity Bubble --- */
        .activity-feed {
            position: fixed; bottom: 30px; left: 30px;
            background: rgba(0,0,0,0.8); border: 1px solid var(--border);
            padding: 12px 20px; border-radius: 50px; display: flex; align-items: center;
            gap: 12px; font-size: 0.8rem; backdrop-filter: blur(10px);
        }
        .pulse-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; animation: pulse-green 2s infinite; }
        @keyframes pulse-green { 0% { box-shadow: 0 0 0 0 rgba(0, 208, 148, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(0, 208, 148, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 208, 148, 0); } }

    </style>
</head>
<body>

    <div id="spotlight"></div>

    <nav>
        <div class="logo">Nana<span>Obasty</span></div>
        <div style="display:flex; gap:25px; font-weight:600; font-size:0.9rem;">
            <a href="#" style="color:white; text-decoration:none; opacity:0.7;">Browse</a>
            <a href="#" style="color:white; text-decoration:none; opacity:0.7;">Safety</a>
            <a href="#" style="color:white; text-decoration:none; opacity:0.7;">Verified</a>
        </div>
        <button class="btn-shimmer">Join Market</button>
    </nav>

    <section class="hero">
        <h1>Trade with <span>Confidence.</span></h1>
        <p style="color:rgba(255,255,255,0.6); max-width:600px; margin:0 auto; line-height:1.6;">
            The premier decentralized marketplace for high-end electronics, vehicles, and real estate in Ghana.
        </p>
    </section>

    <div class="grid" id="marketGrid">
        </div>

    <div class="activity-feed">
        <div class="pulse-dot"></div>
        <span>Kofi just listed a <b>Mercedes GLE</b> in Kumasi</span>
    </div>

    <script>
        // Track Mouse for Spotlight
        document.addEventListener('mousemove', e => {
            document.documentElement.style.setProperty('--x', e.clientX + 'px');
            document.documentElement.style.setProperty('--y', e.clientY + 'px');
        });

        const items = [
            { t: "Rolex Submariner", p: "₵185,000", i: "https://images.unsplash.com/photo-1523170335258-f5ed11844a49?q=80&w=600" },
            { t: "iPhone 15 Pro Max", p: "₵14,200", i: "https://images.unsplash.com/photo-1696446701796-da61225697cc?q=80&w=600" },
            { t: "Range Rover Sport", p: "₵1.4M", i: "https://images.unsplash.com/photo-1606611013016-969c19ba27bb?q=80&w=600" },
            { t: "Nikon Z9 Camera", p: "₵45,000", i: "https://images.unsplash.com/photo-1516035069371-29a1b244cc32?q=80&w=600" }
        ];

        document.getElementById('marketGrid').innerHTML = items.map(item => `
            <div class="card">
                <div class="img-box">
                    <img src="${item.i}">
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <h3 style="font-size:1.2rem;">${item.t}</h3>
                    <span style="color:var(--accent); font-weight:800;">${item.p}</span>
                </div>
                <p style="font-size:0.8rem; color:rgba(255,255,255,0.5); margin-bottom:20px;">
                    Verified Seller • Ghana Card Verified
                </p>
                <div style="display:flex; gap:10px;">
                    <button style="flex:2; background:rgba(255,255,255,0.05); border:1px solid var(--border); color:white; padding:12px; border-radius:12px; cursor:pointer; font-weight:600;">Details</button>
                    <button style="flex:1; background:var(--primary); border:none; color:white; border-radius:12px; cursor:pointer;">📞</button>
                </div>
            </div>
        `).join('');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NANA OBASTY ELITE | Luxury Marketplace</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,1&display=swap" rel="stylesheet">
    
    <style>
        :root { --accent: #C5A059; --dark: #0d0d0d; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--dark); color: #fff; overflow-x: hidden; }
        .gold-text { color: var(--accent); }
        .bg-gold { background: var(--accent); }
        
        /* Mobile-First Navigation */
        .glass-nav { 
            background: rgba(13, 13, 13, 0.9); 
            backdrop-filter: blur(15px); 
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* Responsive Product Cards */
        .product-card { 
            background: #161616; 
            border: 1px solid #222; 
            border-radius: 24px; 
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        
        /* Full-screen Overlay for Mobile */
        #detail-overlay { 
            position: fixed;
            inset: 0;
            background: #0d0d0d;
            z-index: 5000;
            transform: translateY(100%);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }
        #detail-overlay.active { transform: translateY(0); }

        /* Smooth Scrollbar Removal */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Buttons */
        .btn-elite {
            padding: 16px;
            border-radius: 16px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 11px;
            transition: all 0.2s;
        }
    </style>
</head>
<body>

    <!-- Product Detail View (Mobile Optimized) -->
    <div id="detail-overlay" class="hidden flex-col">
        <div class="p-5 flex justify-between items-center border-b border-white/5 sticky top-0 bg-[#0d0d0d]/95 backdrop-blur-md">
            <button onclick="closeDetail()" class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center">
                <span class="material-symbols-outlined">close</span>
            </button>
            <span class="gold-text text-[10px] font-black uppercase tracking-widest">Product Details</span>
            <div class="w-10"></div> <!-- Spacer -->
        </div>

        <div class="p-6 space-y-6 pb-20">
            <div class="rounded-[32px] overflow-hidden aspect-square shadow-2xl">
                <img id="detail-img" src="" class="w-full h-full object-cover">
            </div>
            
            <div class="space-y-2">
                <p id="detail-cat" class="gold-text text-[10px] font-black uppercase tracking-widest"></p>
                <h1 id="detail-name" class="text-3xl font-extrabold tracking-tighter"></h1>
                <p id="detail-price" class="text-2xl font-light text-gray-400"></p>
            </div>

            <div class="flex flex-col gap-3">
                <button id="pay-button" class="btn-elite bg-gold text-black">Buy & Pay Now</button>
                <a id="detail-wa-btn" href="#" class="btn-elite bg-[#25D366] text-white flex justify-center items-center gap-2">
                    <span class="material-symbols-outlined text-sm">chat</span> WhatsApp Inquiry
                </a>
            </div>
        </div>
    </div>

    <!-- Main Navigation -->
    <nav class="glass-nav px-4 py-4">
        <div class="flex justify-between items-center max-w-7xl mx-auto">
            <h1 class="text-lg font-black tracking-tighter uppercase">Obasty <span class="gold-text italic">Elite</span></h1>
            
            <div class="flex items-center gap-5">
                <button onclick="toggleModal()" id="user-display" class="text-[10px] font-black uppercase tracking-widest border border-white/10 px-3 py-2 rounded-full">Sign In</button>
                <button onclick="toggleCart()" class="relative">
                    <span class="material-symbols-outlined text-gray-300">shopping_bag</span>
                    <span id="cart-count" class="absolute -top-1 -right-1 bg-gold text-[8px] w-4 h-4 rounded-full flex items-center justify-center text-black font-black">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Stats Section -->
    <section class="px-4 py-6 grid grid-cols-2 gap-3 max-w-7xl mx-auto">
        <div class="p-5 rounded-3xl border border-white/5 bg-[#161616]">
            <p class="text-[8px] font-black text-gray-500 uppercase tracking-widest mb-1">Elite Stock</p>
            <h4 id="stat-count" class="text-xl font-black">0</h4>
        </div>
        <div class="p-5 rounded-3xl border border-white/5 bg-[#161616]">
            <p class="text-[8px] font-black text-gray-500 uppercase tracking-widest mb-1">Total Value</p>
            <h4 id="stat-value" class="text-xl font-black gold-text">$0</h4>
        </div>
    </section>

    <!-- Categories / Actions -->
    <div class="px-4 py-2 flex gap-2 overflow-x-auto no-scrollbar max-w-7xl mx-auto">
        <button onclick="filterCat('all')" class="px-6 py-3 rounded-full bg-gold text-black text-[10px] font-black uppercase">All</button>
        <button onclick="filterCat('tech')" class="px-6 py-3 rounded-full bg-white/5 text-[10px] font-bold uppercase">Tech</button>
        <button onclick="filterCat('style')" class="px-6 py-3 rounded-full bg-white/5 text-[10px] font-bold uppercase">Fashion</button>
        <button onclick="checkAuthAndSell()" class="px-6 py-3 rounded-full bg-white text-black text-[10px] font-black uppercase ml-auto">Sell</button>
    </div>

    <!-- Product Grid -->
    <main class="px-4 py-8 max-w-7xl mx-auto">
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Products injected here -->
        </div>
    </main>

    <!-- Auth Modal -->
    <div id="auth-modal" class="fixed inset-0 bg-black/95 z-[9999] hidden flex items-center justify-center p-6">
        <div class="bg-[#1a1a1a] w-full max-w-md rounded-[32px] p-8 border border-white/10 relative">
            <button onclick="toggleModal()" class="absolute top-6 right-6 material-symbols-outlined">close</button>
            <div class="text-center space-y-6">
                <h2 class="text-2xl font-black uppercase italic gold-text">Elite Access</h2>
                <button onclick="handleGoogleSignIn()" class="w-full bg-white text-black py-4 rounded-2xl font-black text-xs flex items-center justify-center gap-3">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-4 h-4">
                    Sign in with Google
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDyC4uyc10cXAFOESh4DSUSPXJN4EgVy_I",
            authDomain: "obasty-market.firebaseapp.com",
            projectId: "obasty-market",
            storageBucket: "obasty-market.firebasestorage.app",
            messagingSenderId: "753490577388",
            appId: "1:753490577388:web:b091a8f4ba9d88c0e662c9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // UI Functions
        window.toggleModal = () => document.getElementById('auth-modal').classList.toggle('hidden');
        
        window.openDetail = (data) => {
            const p = JSON.parse(decodeURIComponent(data));
            document.getElementById('detail-img').src = p.image;
            document.getElementById('detail-name').innerText = p.name;
            document.getElementById('detail-price').innerText = `$${p.price.toLocaleString()}`;
            document.getElementById('detail-cat').innerText = p.category;
            
            const overlay = document.getElementById('detail-overlay');
            overlay.classList.remove('hidden');
            setTimeout(() => overlay.classList.add('active'), 10);
            document.body.style.overflow = 'hidden';
        };

        window.closeDetail = () => {
            const overlay = document.getElementById('detail-overlay');
            overlay.classList.remove('active');
            setTimeout(() => {
                overlay.classList.add('hidden');
                document.body.style.overflow = 'auto';
            }, 500);
        };

        window.handleGoogleSignIn = async () => {
            try {
                await signInWithPopup(auth, provider);
                toggleModal();
            } catch(e) { alert(e.message); }
        };

        // Auth Listener
        onAuthStateChanged(auth, user => {
            document.getElementById('user-display').innerText = user ? user.displayName.split(' ')[0] : "Sign In";
        });

        // Real-time Product Loading
        onSnapshot(query(collection(db, "products"), orderBy("createdAt", "desc")), (snap) => {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            let count = 0; let total = 0;

            snap.forEach(ds => {
                const p = ds.data();
                count++; total += p.price;
                const dataString = encodeURIComponent(JSON.stringify({...p, id: ds.id}));
                
                const card = document.createElement('div');
                card.className = "product-card";
                card.innerHTML = `
                    <div onclick="openDetail('${dataString}')">
                        <img src="${p.image}" class="w-full h-72 object-cover">
                        <div class="p-5 space-y-1">
                            <p class="text-[9px] gold-text font-black uppercase tracking-widest">${p.category}</p>
                            <h3 class="font-bold truncate text-sm">${p.name}</h3>
                            <p class="text-lg font-light text-gray-400">$${p.price.toLocaleString()}</p>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            document.getElementById('stat-count').innerText = count;
            document.getElementById('stat-value').innerText = `$${total.toLocaleString()}`;
        });

    </script>
</body>
</html>

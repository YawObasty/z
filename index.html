<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NANA OBASTY ELITE | Luxury Marketplace</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,1&display=swap" rel="stylesheet">
    
    <style>
        :root { --accent: #C5A059; --dark: #121212; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0d0d0d; color: #fff; overflow-x: hidden; }
        .gold-text { color: var(--accent); }
        .bg-gold { background: var(--accent); }
        .glass-nav { background: rgba(18, 18, 18, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid #222; }
        .product-card { background: #1a1a1a; border: 1px solid #222; transition: all 0.4s ease; border-radius: 20px; overflow: hidden; }
        .product-card:hover { border-color: var(--accent); transform: translateY(-10px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        #detail-overlay { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateY(100%); z-index: 5000; }
        #detail-overlay.active { transform: translateY(0); display: flex; }
    </style>
</head>
<body>

    <div id="detail-overlay" class="fixed inset-0 bg-[#0d0d0d] hidden flex flex-col overflow-y-auto">
        <div class="sticky top-0 p-6 flex justify-between items-center bg-[#0d0d0d]/95 backdrop-blur-xl z-[5001] border-b border-white/5">
            <button onclick="window.closeDetail()" class="w-12 h-12 rounded-full bg-[#1a1a1a] flex items-center justify-center hover:bg-gold hover:text-black transition">
                <span class="material-symbols-outlined">arrow_back</span>
            </button>
            <h2 class="text-[10px] font-black uppercase tracking-[0.3em] gold-text">Product View</h2>
            <div class="w-12"></div>
        </div>

        <div class="container mx-auto px-6 py-8">
            <div class="flex flex-col lg:flex-row gap-12">
                <div class="w-full lg:w-2/3 rounded-[40px] overflow-hidden bg-[#1a1a1a]">
                    <img id="detail-img" src="" class="w-full h-full object-cover shadow-2xl">
                </div>
                <div class="w-full lg:w-1/3 space-y-8">
                    <div>
                        <p id="detail-cat" class="text-gold font-black text-[10px] uppercase tracking-widest mb-2"></p>
                        <h1 id="detail-name" class="text-4xl font-black uppercase leading-tight mb-4 tracking-tighter"></h1>
                        <p id="detail-price" class="text-3xl font-light text-gray-400"></p>
                    </div>
                    <div class="flex flex-col gap-4">
                        <button id="pay-button" class="w-full bg-gold text-black py-5 rounded-2xl font-black uppercase text-xs hover:scale-[1.02] transition flex items-center justify-center gap-2">
                            <span class="material-symbols-outlined">credit_card</span> Buy & Pay Now
                        </button>
                        <a id="detail-wa-btn" href="#" target="_blank" class="w-full border border-white/10 text-white py-5 rounded-2xl font-black uppercase text-xs flex items-center justify-center gap-3 transition hover:bg-white hover:text-black">
                            <span class="material-symbols-outlined">chat</span> Chat with Seller
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <nav class="glass-nav sticky top-0 z-[100] px-6 py-4">
        <div class="container mx-auto flex justify-between items-center">
            <a href="#" class="text-2xl font-black tracking-tighter">
                NANA OBASTY <span class="bg-gold text-black px-2 py-0.5 rounded italic text-xl">ELITE</span>
            </a>
            <div class="flex items-center space-x-6">
                <button onclick="window.toggleModal()" class="flex items-center gap-2">
                    <p id="user-display" class="text-[11px] font-black uppercase tracking-widest">Sign In</p>
                </button>
                <span class="material-symbols-outlined text-2xl cursor-pointer hover:text-gold" onclick="window.toggleCart()">shopping_cart</span>
            </div>
        </div>
    </nav>

    <section class="container mx-auto px-6 pt-10 grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="bg-[#1a1a1a] p-6 rounded-3xl border-l-4 border-gold">
            <p class="text-[9px] font-black uppercase text-gray-500 mb-1">Listings</p>
            <h4 id="stat-count" class="text-2xl font-black italic">0</h4>
        </div>
        <div class="bg-[#1a1a1a] p-6 rounded-3xl border-l-4 border-white/20">
            <p class="text-[9px] font-black uppercase text-gray-500 mb-1">Total Value</p>
            <h4 id="stat-value" class="text-2xl font-black italic text-gold">$0</h4>
        </div>
    </section>

    <section class="container mx-auto px-6 py-8 flex gap-4 overflow-x-auto no-scrollbar">
        <button onclick="window.filterCat('all')" class="px-8 py-3 rounded-full bg-gold text-black font-black text-[10px] uppercase tracking-widest">All</button>
        <button onclick="window.filterCat('tech')" class="px-8 py-3 rounded-full bg-[#1a1a1a] border border-[#333] font-bold text-[10px] uppercase">Tech</button>
        <button onclick="window.filterCat('style')" class="px-8 py-3 rounded-full bg-[#1a1a1a] border border-[#333] font-bold text-[10px] uppercase">Fashion</button>
        <button onclick="window.checkAuthAndSell()" class="px-8 py-3 rounded-full bg-white text-black font-black text-[10px] uppercase flex items-center gap-2 ml-auto">
            <span class="material-symbols-outlined text-sm">add_a_photo</span> Sell Item
        </button>
    </section>

    <main class="container mx-auto px-6 pb-20">
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"></div>
    </main>

    <div id="auth-modal" class="fixed inset-0 bg-black/95 z-[6000] hidden flex items-center justify-center p-4">
        <div class="bg-[#1a1a1a] w-full max-w-md rounded-[30px] p-10 border border-[#333] relative">
            <button onclick="window.toggleModal()" class="absolute top-6 right-6 material-symbols-outlined">close</button>
            <form id="authForm" class="space-y-4">
                <h2 class="text-3xl font-black uppercase mb-8 gold-text italic">Elite Access</h2>
                <input type="email" id="authEmail" placeholder="Email" class="w-full p-4 bg-[#0d0d0d] border border-[#333] rounded-xl text-white outline-none">
                <input type="password" id="authPass" placeholder="Password" class="w-full p-4 bg-[#0d0d0d] border border-[#333] rounded-xl text-white outline-none">
                <button type="submit" class="w-full bg-gold text-black py-4 rounded-xl font-black uppercase">Enter</button>
            </form>
        </div>
    </div>

    <div id="sell-modal" class="fixed inset-0 bg-black/95 z-[6000] hidden flex items-center justify-center p-4">
        <div class="bg-[#1a1a1a] w-full max-w-md rounded-[30px] p-10 border border-[#333] relative">
            <button onclick="window.toggleSellModal()" class="absolute top-6 right-6 material-symbols-outlined">close</button>
            <form id="sellForm" class="space-y-4">
                <h2 class="text-3xl font-black uppercase mb-8 gold-text italic">New Listing</h2>
                <input type="text" id="pName" placeholder="Item Name" class="w-full p-4 bg-[#0d0d0d] border border-[#333] rounded-xl text-white outline-none" required>
                <input type="number" id="pPrice" placeholder="Price ($)" class="w-full p-4 bg-[#0d0d0d] border border-[#333] rounded-xl text-white outline-none" required>
                <input type="tel" id="pPhone" placeholder="WhatsApp (e.g. 233...)" class="w-full p-4 bg-[#0d0d0d] border border-[#333] rounded-xl text-white outline-none" required>
                <select id="pCat" class="w-full p-4 bg-[#0d0d0d] border border-[#333] rounded-xl text-gray-400 outline-none">
                    <option value="tech">Technology</option>
                    <option value="style">Fashion</option>
                </select>
                <input type="file" id="pFile" accept="image/*" class="w-full p-4 bg-[#0d0d0d] border border-[#333] rounded-xl text-white" required>
                <button type="submit" id="sellSubmitBtn" class="w-full bg-gold text-black py-4 rounded-xl font-black uppercase">Post Live</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDyC4uyc10cXAFOESh4DSUSPXJN4EgVy_I",
            authDomain: "obasty-market.firebaseapp.com",
            projectId: "obasty-market",
            storageBucket: "obasty-market.firebasestorage.app",
            messagingSenderId: "753490577388",
            appId: "1:753490577388:web:b091a8f4ba9d88c0e662c9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const storage = getStorage(app);
        const pRef = collection(db, "products");

        let allProducts = [];
        window.isLoggedIn = false;

        // UI Helpers
        window.toggleModal = () => document.getElementById('auth-modal').classList.toggle('hidden');
        window.toggleSellModal = () => document.getElementById('sell-modal').classList.toggle('hidden');
        window.checkAuthAndSell = () => window.isLoggedIn ? window.toggleSellModal() : window.toggleModal();

        // Auth Listener
        onAuthStateChanged(auth, (user) => {
            window.isLoggedIn = !!user;
            document.getElementById('user-display').innerText = user ? user.email.split('@')[0].toUpperCase() : "SIGN IN";
        });

        // Sign In Form
        document.getElementById('authForm').onsubmit = async (e) => {
            e.preventDefault();
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('authEmail').value, document.getElementById('authPass').value);
                window.toggleModal();
            } catch(err) { alert(err.message); }
        };

        // Sell Form (Image Upload + Firestore)
        document.getElementById('sellForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('sellSubmitBtn');
            const file = document.getElementById('pFile').files[0];
            try {
                btn.innerText = "UPLOADING..."; btn.disabled = true;
                const fileRef = sRef(storage, `products/${Date.now()}_${file.name}`);
                const snapshot = await uploadBytes(fileRef, file);
                const url = await getDownloadURL(snapshot.ref);
                await addDoc(pRef, {
                    name: document.getElementById('pName').value,
                    price: parseFloat(document.getElementById('pPrice').value),
                    phone: document.getElementById('pPhone').value,
                    category: document.getElementById('pCat').value,
                    image: url,
                    sellerEmail: auth.currentUser.email,
                    createdAt: Date.now()
                });
                window.toggleSellModal();
                e.target.reset();
            } catch (err) { alert(err.message); }
            finally { btn.innerText = "POST LIVE"; btn.disabled = false; }
        };

        // Delete Function
        window.deleteProduct = async (id) => {
            if (confirm("Permanently delete this elite listing?")) {
                await deleteDoc(doc(db, "products", id));
            }
        };

        // Paystack Integration
        window.initiatePayment = (p) => {
            if(!window.isLoggedIn) { alert("Please Sign In to purchase."); window.toggleModal(); return; }
            const handler = PaystackPop.setup({
                key: 'pk_test_fd948c38f7e164563aef8a2ce72b8ceb627932cd',
                email: auth.currentUser.email,
                amount: Math.round(p.price * 15 * 100), // Calculation: $Price * 15 rate * 100 pesewas
                currency: 'GHS',
                ref: 'ELITE_' + Date.now(),
                callback: (response) => alert('Transaction Successful! Ref: ' + response.reference)
            });
            handler.openIframe();
        };

        // Detail Page Logic
        window.openDetail = (data) => {
            const p = JSON.parse(decodeURIComponent(data));
            document.getElementById('detail-img').src = p.image;
            document.getElementById('detail-name').innerText = p.name;
            document.getElementById('detail-cat').innerText = p.category;
            document.getElementById('detail-price').innerText = `$${p.price.toLocaleString()}`;
            document.getElementById('pay-button').onclick = () => window.initiatePayment(p);
            document.getElementById('detail-wa-btn').href = `https://wa.me/${p.phone}?text=I'm interested in the ${p.name}`;
            
            const overlay = document.getElementById('detail-overlay');
            overlay.classList.remove('hidden');
            setTimeout(() => overlay.classList.add('active'), 10);
        };

        window.closeDetail = () => {
            const overlay = document.getElementById('detail-overlay');
            overlay.classList.remove('active');
            setTimeout(() => overlay.classList.add('hidden'), 400);
        };

        // Real-time listener for Product Grid
        onSnapshot(query(pRef, orderBy("createdAt", "desc")), (snap) => {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            let totalVal = 0;
            allProducts = [];

            snap.forEach(ds => {
                const p = ds.data(); const id = ds.id;
                const prod = {...p, id};
                allProducts.push(prod);
                totalVal += p.price;
                const isOwner = auth.currentUser && auth.currentUser.email === p.sellerEmail;
                const dataStr = encodeURIComponent(JSON.stringify(prod));

                const card = document.createElement('div');
                card.className = "product-card cursor-pointer";
                card.setAttribute('data-cat', p.category);
                card.innerHTML = `
                    <div class="h-64 overflow-hidden relative">
                        ${isOwner ? `<button onclick="event.stopPropagation(); window.deleteProduct('${id}')" class="absolute top-3 left-3 z-20 bg-red-600/80 p-2 rounded-full hover:bg-red-600 transition"><span class="material-symbols-outlined text-sm">delete</span></button>` : ''}
                        <img src="${p.image}" class="w-full h-full object-cover transition-transform duration-700 hover:scale-110" onclick="window.openDetail('${dataStr}')">
                    </div>
                    <div class="p-6" onclick="window.openDetail('${dataStr}')">
                        <div class="flex justify-between items-start">
                            <h3 class="font-bold text-gray-200 text-sm truncate w-2/3">${p.name}</h3>
                            <p class="text-gold font-black">$${p.price.toLocaleString()}</p>
                        </div>
                    </div>`;
                grid.appendChild(card);
            });
            document.getElementById('stat-count').innerText = allProducts.length;
            document.getElementById('stat-value').innerText = `$${totalVal.toLocaleString()}`;
        });

        window.filterCat = (cat) => {
            document.querySelectorAll('.product-card').forEach(c => {
                c.style.display = (cat === 'all' || c.getAttribute('data-cat') === cat) ? 'block' : 'none';
            });
        };
    </script>
</body>
</html>

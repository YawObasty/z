<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NANA OBASTY ELITE | Luxury Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,1&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #C5A059; --dark: #121212; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0d0d0d; color: #fff; }
        .gold-text { color: var(--accent); }
        .bg-gold { background: var(--accent); }
        .glass-nav { background: rgba(18, 18, 18, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid #222; }
        .product-card { background: #1a1a1a; border: 1px solid #222; transition: all 0.4s ease; border-radius: 20px; overflow: hidden; }
        .product-card:hover { border-color: var(--accent); transform: translateY(-10px); }
        .wishlist-btn.active { color: #ff4b2b; font-variation-settings: 'FILL' 1; }
        .toast-notify { animation: slideUp 0.5s ease forwards; }
        @keyframes slideUp { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div id="live-toast" class="fixed bottom-6 left-6 z-[2000] hidden">
        <div class="bg-white text-black p-4 rounded-2xl shadow-2xl flex items-center gap-4 toast-notify">
            <div class="w-10 h-10 bg-gold rounded-full flex items-center justify-center text-white">
                <span class="material-symbols-outlined">shopping_bag</span>
            </div>
            <div>
                <p class="text-[10px] font-bold uppercase text-gray-400">Recent Purchase</p>
                <p id="toast-msg" class="text-xs font-black">Someone just bought an item</p>
            </div>
        </div>
    </div>

    <nav class="glass-nav sticky top-0 z-[100] px-6 py-4">
        <div class="container mx-auto flex justify-between items-center">
            <a href="#" class="text-2xl font-black tracking-tighter flex items-center gap-2">
                NANA <span class="bg-gold text-black px-2 py-0.5 rounded italic text-xl">ELITE</span>
            </a>
            
            <div class="hidden lg:flex flex-1 max-w-md mx-10 relative">
                <input type="text" id="searchInput" onkeyup="window.searchProducts()" placeholder="Search luxury items..." class="w-full bg-[#222] border-none rounded-full py-2.5 px-6 text-sm focus:ring-2 ring-[#C5A059] text-white">
                <span class="material-symbols-outlined absolute right-4 top-2.5 text-gray-500">search</span>
            </div>

            <div class="flex items-center space-x-6">
                <div class="flex items-center gap-3">
                    <button onclick="window.toggleModal()" class="flex items-center gap-2 group">
                        <div class="w-10 h-10 rounded-full border border-gray-700 flex items-center justify-center group-hover:border-gold transition">
                            <span class="material-symbols-outlined text-gray-400 group-hover:text-gold">person</span>
                        </div>
                        <div class="text-left hidden sm:block">
                            <p class="text-[9px] font-bold text-gray-500 uppercase">Welcome</p>
                            <p id="user-display" class="text-[11px] font-black uppercase tracking-widest">Sign In</p>
                        </div>
                    </button>
                    <button id="logout-btn" onclick="window.handleLogout()" class="hidden text-gray-500 hover:text-red-500 transition">
                        <span class="material-symbols-outlined text-xl">logout</span>
                    </button>
                </div>
                <div class="relative cursor-pointer" onclick="window.toggleCart()">
                    <span class="material-symbols-outlined text-2xl hover:text-gold transition">shopping_cart</span>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-gold text-black text-[9px] w-4 h-4 flex items-center justify-center rounded-full font-black">0</span>
                </div>
            </div>
        </div>
    </nav>

    <section class="container mx-auto px-6 py-8">
        <div class="flex gap-4 overflow-x-auto no-scrollbar pb-4">
            <button onclick="window.filterCat('all')" class="px-8 py-3 rounded-full bg-gold text-black font-black text-[10px] uppercase tracking-widest">All Collections</button>
            <button onclick="window.filterCat('tech')" class="px-8 py-3 rounded-full bg-[#1a1a1a] border border-[#333] hover:border-gold transition font-bold text-[10px] uppercase tracking-widest">Tech</button>
            <button onclick="window.filterCat('style')" class="px-8 py-3 rounded-full bg-[#1a1a1a] border border-[#333] hover:border-gold transition font-bold text-[10px] uppercase tracking-widest">Fashion</button>
            <button onclick="window.checkAuthAndSell()" class="px-8 py-3 rounded-full bg-white text-black font-black text-[10px] uppercase tracking-widest flex items-center gap-2">
                <span class="material-symbols-outlined text-sm">add_circle</span> List Item
            </button>
        </div>
    </section>

    <main class="container mx-auto px-6 pb-20">
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"></div>
    </main>

    <div id="auth-modal" class="fixed inset-0 bg-black/95 z-[2000] hidden items-center justify-center p-4">
        <div class="bg-[#1a1a1a] w-full max-w-md rounded-[30px] p-10 border border-[#333] relative">
            <button onclick="window.toggleModal()" class="absolute top-6 right-6 material-symbols-outlined text-gray-500">close</button>
            <h2 class="text-3xl font-black uppercase mb-8 gold-text italic">Elite Access</h2>
            <form id="authForm" class="space-y-4">
                <input type="email" id="authEmail" placeholder="Email" class="w-full p-4 bg-[#0d0d0d] border border-[#333] rounded-xl text-white outline-none">
                <input type="password" id="authPass" placeholder="Password" class="w-full p-4 bg-[#0d0d0d] border border-[#333] rounded-xl text-white outline-none">
                <button type="submit" class="w-full bg-gold text-black py-4 rounded-xl font-black uppercase">Enter</button>
            </form>
        </div>
    </div>

    <div id="sell-modal" class="fixed inset-0 bg-black/95 z-[2000] hidden items-center justify-center p-4">
        <div class="bg-[#1a1a1a] w-full max-w-md rounded-[30px] p-10 border border-[#333] relative">
            <button onclick="window.toggleSellModal()" class="absolute top-6 right-6 material-symbols-outlined">close</button>
            <h2 class="text-3xl font-black uppercase mb-8 gold-text italic">List Luxury</h2>
            <form id="sellForm" class="space-y-4">
                <input type="text" id="pName" placeholder="Item Name" class="w-full p-4 bg-[#0d0d0d] border border-[#333] rounded-xl text-white outline-none" required>
                <input type="number" id="pPrice" placeholder="Price ($)" class="w-full p-4 bg-[#0d0d0d] border border-[#333] rounded-xl text-white outline-none" required>
                <input type="tel" id="pPhone" placeholder="WhatsApp (233...)" class="w-full p-4 bg-[#0d0d0d] border border-[#333] rounded-xl text-white outline-none" required>
                <select id="pCat" class="w-full p-4 bg-[#0d0d0d] border border-[#333] rounded-xl text-gray-400 outline-none">
                    <option value="tech">Technology</option>
                    <option value="style">Fashion</option>
                </select>
                <input type="url" id="pImg" placeholder="Image URL" class="w-full p-4 bg-[#0d0d0d] border border-[#333] rounded-xl text-white outline-none" required>
                <button type="submit" class="w-full bg-gold text-black py-4 rounded-xl font-black uppercase">Post Live</button>
            </form>
        </div>
    </div>

    <div id="cart-overlay" class="fixed inset-0 bg-black/60 z-[150] hidden" onclick="window.toggleCart()"></div>
    <div id="cart-sidebar" class="fixed right-0 top-0 h-full w-full max-w-md bg-[#121212] z-[151] translate-x-full transition-transform duration-500 border-l border-[#333] flex flex-col">
        <div class="p-8 border-b border-[#222] flex justify-between items-center">
            <h2 class="text-xl font-black uppercase gold-text">Your Selection</h2>
            <button onclick="window.toggleCart()" class="material-symbols-outlined">close</button>
        </div>
        <div id="cart-items" class="flex-1 overflow-y-auto p-8 space-y-6"></div>
        <div class="p-8 bg-[#1a1a1a] border-t border-[#222]">
            <div class="flex justify-between mb-8"><span class="text-gray-500 font-bold uppercase text-xs">Total</span><span id="cart-total" class="text-2xl font-black gold-text">$0</span></div>
            <button class="w-full bg-gold text-black py-5 rounded-2xl font-black uppercase">Secure Checkout</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDyC4uyc10cXAFOESh4DSUSPXJN4EgVy_I",
            authDomain: "obasty-market.firebaseapp.com",
            projectId: "obasty-market",
            storageBucket: "obasty-market.firebasestorage.app",
            messagingSenderId: "753490577388",
            appId: "1:753490577388:web:b091a8f4ba9d88c0e662c9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const pRef = collection(db, "products");

        let cart = [];
        window.isLoggedIn = false;

        // AUTH TRACKING
        onAuthStateChanged(auth, (user) => {
            window.isLoggedIn = !!user;
            const display = document.getElementById('user-display');
            const logoutBtn = document.getElementById('logout-btn');
            if(user) {
                display.innerText = user.email.split('@')[0].toUpperCase();
                logoutBtn.classList.remove('hidden');
            } else {
                display.innerText = "SIGN IN";
                logoutBtn.classList.add('hidden');
            }
        });

        window.handleLogout = async () => { if(confirm("Logout?")) await signOut(auth); };
        window.toggleModal = () => document.getElementById('auth-modal').classList.toggle('hidden');
        window.toggleSellModal = () => document.getElementById('sell-modal').classList.toggle('hidden');
        window.toggleCart = () => {
            document.getElementById('cart-sidebar').classList.toggle('translate-x-full');
            document.getElementById('cart-overlay').classList.toggle('hidden');
        };

        document.getElementById('authForm').onsubmit = async (e) => {
            e.preventDefault();
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('authEmail').value, document.getElementById('authPass').value);
                window.toggleModal();
            } catch(err) { alert(err.message); }
        };

        window.deleteProduct = async (id) => {
            if (

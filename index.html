<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanaObasty | Premium Trade</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #2563eb;
            --text: #0f172a;
            --light-text: #64748b;
            --bg: #ffffff;
            --card-bg: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 100px; line-height: 1.5; }

        /* --- CLEAN HEADER --- */
        header {
            padding: 25px 6%; display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 20px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--text); }
        .logo span { color: var(--accent); }

        /* --- HERO SECTION --- */
        .hero { padding: 40px 6%; }
        .hero h1 { font-size: 42px; font-weight: 800; letter-spacing: -2px; line-height: 1; margin-bottom: 15px; }
        
        .search-pill {
            background: var(--card-bg); border-radius: 100px; padding: 10px 10px 10px 25px;
            display: flex; align-items: center; border: 1px solid #e2e8f0; margin-top: 25px;
        }
        .search-pill input { border: none; background: none; outline: none; width: 100%; font-size: 16px; font-weight: 500; }
        .search-circle { 
            width: 45px; height: 45px; background: var(--text); border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }

        /* --- VIEW CONTROLS --- */
        .view { display: none; animation: fadeIn 0.5s ease; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- PREMIUM GRID --- */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 40px; padding: 20px 6%; }
        
        .item-card { cursor: pointer; transition: 0.3s; }
        .item-card:hover { opacity: 0.8; }
        .img-wrap { 
            aspect-ratio: 4/5; width: 100%; background: var(--card-bg); 
            border-radius: 4px; overflow: hidden; margin-bottom: 15px; 
        }
        .img-wrap img { width: 100%; height: 100%; object-fit: cover; }
        
        .item-meta { display: flex; justify-content: space-between; align-items: flex-start; }
        .item-title { font-size: 16px; font-weight: 700; max-width: 70%; }
        .item-price { font-size: 16px; font-weight: 400; color: var(--light-text); }

        /* --- FORM STYLING --- */
        .full-screen-form { max-width: 600px; margin: 0 auto; padding: 40px 20px; }
        input[type="text"], input[type="number"], select, textarea {
            width: 100%; border: none; border-bottom: 1px solid #e2e8f0; padding: 20px 0;
            font-size: 18px; margin-bottom: 20px; outline: none; transition: 0.3s;
        }
        input:focus { border-bottom-color: var(--text); }
        .btn-black { background: var(--text); color: white; border: none; padding: 20px; width: 100%; font-weight: 700; border-radius: 4px; cursor: pointer; margin-top: 20px; }

        /* --- DOCK NAVIGATION --- */
        .dock {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px);
            padding: 10px 30px; border-radius: 100px; display: flex; gap: 40px; z-index: 1000;
        }
        .dock-item { color: rgba(255,255,255,0.5); cursor: pointer; transition: 0.3s; font-size: 12px; font-weight: 700; text-align: center; }
        .dock-item.active { color: white; }
        .dock-item svg { display: block; margin: 0 auto 4px; width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.5; }

    </style>
</head>

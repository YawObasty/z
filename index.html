<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanaObasty Marketplace | Ghana</title>
    <style>
        /* --- CORE STYLES --- */
        :root { --bg: #f4f7f6; --card-bg: #fff; --text: #333; --nav-bg: #1a2a3a; --border: #eee; --input-bg: #fff; --accent: #4db8ff; --heart: #ff4757; --verified: #1d9bf0; }
        [data-theme="dark"] { --bg: #0f172a; --card-bg: #1e293b; --text: #f1f5f9; --nav-bg: #020617; --border: #334155; --input-bg: #334155; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; transition: background 0.3s, color 0.3s; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 80px; }
        
        /* --- MODAL OVERLAYS --- */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 3000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--card-bg); color: var(--text); padding: 25px; border-radius: 20px; max-width: 500px; width: 95%; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }

        /* --- POST ITEM FORM STYLES --- */
        .post-form-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .post-form-grid { display: grid; gap: 15px; }
        .post-form-grid input, .post-form-grid select, .post-form-grid textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--input-bg); color: var(--text); font-size: 0.95rem; }
        .post-form-grid label { font-size: 0.8rem; font-weight: bold; color: var(--accent); margin-bottom: -10px; }

        /* --- PRODUCT GRID --- */
        nav.top-nav { background: var(--nav-bg); color: #fff; padding: 1rem 10%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; padding: 20px 10%; }
        .product-card { background: var(--card-bg); border-radius: 15px; overflow: hidden; border: 1px solid var(--border); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .product-img { height: 200px; background-size: cover; background-position: center; }
        
        /* --- BUTTONS --- */
        .btn { background: var(--accent); color: #fff; padding: 12px; border-radius: 10px; font-weight: bold; border: none; cursor: pointer; width: 100%; transition: transform 0.2s; }
        .btn:active { transform: scale(0.98); }
        .close-modal { background: none; border: none; color: gray; font-size: 1.5rem; cursor: pointer; }

        /* --- BOTTOM NAV --- */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--card-bg); display: flex; justify-content: space-around; padding: 12px; border-top: 1px solid var(--border); z-index: 2000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--text); font-size: 0.75rem; gap: 4px; border: none; background: none; cursor: pointer; }
        .nav-item.sell-btn-main { background: var(--accent); color: white; width: 50px; height: 50px; border-radius: 50%; margin-top: -30px; border: 5px solid var(--bg); box-shadow: 0 4px 10px rgba(0,0,0,0.2); justify-content: center; font-size: 1.2rem; }
    </style>
</head>
<body data-theme="light">

    <nav class="top-nav">
        <div class="logo">NANAOBASTY</div>
        <button onclick="toggleTheme()" id="themeBtn" style="background:none; border:none; color:white; font-size:1.2rem; cursor:pointer;">🌙</button>
    </nav>

    <div id="productGrid" class="product-grid">
        </div>

    <div id="postModal" class="modal-overlay">
        <div class="modal-content">
            <div class="post-form-header">
                <h3>Post New Item</h3>
                <button class="close-modal" onclick="closePostModal()">×</button>
            </div>
            <form id="sellForm" class="post-form-grid">
                <label>Item Photo</label>
                <input type="file" id="pImage" accept="image/*" required>
                
                <input type="text" id="pName" placeholder="What are you selling?" required>
                <input type="number" id="pPrice" placeholder="Price (₵)" required>
                
                <select id="pRegion" required>
                    <option value="">Select Region</option>
                    <option>Greater Accra</option><option>Ashanti Region</option><option>Eastern Region</option>
                    <option>Western Region</option><option>Central Region</option><option>Volta Region</option>
                </select>
                
                <input type="text" id="pCustomLoc" placeholder="City / Town (e.g. Madina)" required>
                <textarea id="pDesc" placeholder="Describe your item..." rows="3" required></textarea>
                
                <button type="submit" id="submitPostBtn" class="btn">🚀 Publish Listing</button>
            </form>
        </div>
    </div>

    <div id="authModal" class="modal-overlay">
        <div class="modal-content">
            <div id="profileSection" style="display:none;">
                <h3 style="text-align:center; margin-bottom:15px;">Your Profile</h3>
                <div id="profilePic" style="width:80px; height:80px; border-radius:50%; margin:0 auto 10px; background-size:cover; background-position:center; display:flex; align-items:center; justify-content:center; background-color:var(--accent); color:white; font-weight:bold; font-size:2rem;"></div>
                <p id="profName" style="text-align:center; font-weight:bold;"></p>
                <button onclick="signOutUser()" class="btn" style="background:#e74c3c; margin-top:20px;">Logout</button>
            </div>
            <div id="authFields">
                <h3>Please Login</h3>
                <p>You need an account to post or view profile.</p>
                <button onclick="/* Logic to trigger login */" class="btn" style="margin-top:15px;">Go to Login</button>
            </div>
            <button onclick="closeAuth()" style="margin-top:15px; width:100%; background:none; border:none; color:gray;">Close</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item" onclick="window.scrollTo(0,0)">
            <span>🛒</span> Explore
        </button>
        
        <button class="nav-item sell-btn-main" onclick="openPostModal()">
            ➕
        </button>
        
        <button class="nav-item" onclick="openAuth()">
            <span>👤</span> Account
        </button>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDyC4uyc10cXAFOESh4DSUSPXJN4EgVy_I", authDomain: "obasty-market.firebaseapp.com", projectId: "obasty-market", appId: "1:753490577388:web:8b2dac8f4082d89ee662c9" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        let userData = null;
        const IMGBB_API = "f6f1d931d2c5da11833752754cf2dfcd";

        onAuthStateChanged(auth, async (user) => {
            if(user) {
                const s = await getDoc(doc(db, "users", user.uid));
                userData = s.data();
                document.getElementById('authFields').style.display = 'none';
                document.getElementById('profileSection').style.display = 'block';
                document.getElementById('profName').innerText = userData.name;
                if(userData.photo) document.getElementById('profilePic').style.backgroundImage = `url('${userData.photo}')`;
            }
        });

        // HANDLE POSTING
        document.getElementById('sellForm').onsubmit = async (e) => {
            e.preventDefault();
            if(!auth.currentUser) return alert("Please login first!");

            const btn = document.getElementById('submitPostBtn');
            btn.innerText = "Uploading..."; btn.disabled = true;

            try {
                const fd = new FormData(); fd.append("image", document.getElementById('pImage').files[0]);
                const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API}`, { method: "POST", body: fd });
                const img = await res.json();

                await addDoc(collection(db, "listings"), {
                    name: document.getElementById('pName').value,
                    price: document.getElementById('pPrice').value,
                    region: document.getElementById('pRegion').value,
                    location: document.getElementById('pCustomLoc').value,
                    image: img.data.url,
                    sellerId: auth.currentUser.uid,
                    sellerName: userData.name,
                    sellerPhone: userData.phone,
                    sellerPhoto: userData.photo || "",
                    createdAt: new Date()
                });

                alert("Item Published Successfully!");
                closePostModal();
                location.reload();
            } catch(err) {
                alert("Error posting item. Try again.");
                btn.innerText = "Publish Listing"; btn.disabled = false;
            }
        };

        // RENDER SHOP
        onSnapshot(query(collection(db, "listings"), orderBy("createdAt", "desc")), (snap) => {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = "";
            snap.forEach(d => {
                const item = d.data();
                grid.innerHTML += `
                    <div class="product-card">
                        <div class="product-img" style="background-image:url('${item.image}')"></div>
                        <div class="product-info">
                            <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
                                <div style="width:24px; height:24px; border-radius:50%; background-image:url('${item.sellerPhoto}'); background-size:cover; background-color:#ddd;"></div>
                                <span style="font-size:0.8rem; font-weight:bold;">${item.sellerName}</span>
                            </div>
                            <h4 style="margin-bottom:5px;">${item.name}</h4>
                            <p style="color:var(--accent); font-weight:bold; font-size:1.1rem;">₵ ${item.price}</p>
                            <p style="font-size:0.8rem; color:gray;">📍 ${item.location}, ${item.region}</p>
                        </div>
                    </div>`;
            });
        });

        window.signOutUser = () => signOut(auth).then(() => location.reload());
    </script>

    <script>
        function openPostModal() { document.getElementById('postModal').classList.add('active'); }
        function closePostModal() { document.getElementById('postModal').classList.remove('active'); }
        function openAuth() { document.getElementById('authModal').classList.add('active'); }
        function closeAuth() { document.getElementById('authModal').classList.remove('active'); }
        function toggleTheme() {
            const b = document.body;
            const isDark = b.getAttribute('data-theme') === 'dark';
            b.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('themeBtn').innerText = isDark ? '🌙' : '☀️';
        }
    </script>
</body>
</html>

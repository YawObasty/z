<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NANA OBASTY | Premium Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .product-card:hover img { transform: scale(1.05); }
        .hero-bg {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&q=80&w=1920');
            background-size: cover;
            background-position: center;
        }
        .hidden-form { display: none; }
        .cart-sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        /* Jumia Style Horizontal Scroll */
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-[#F4F4F6] text-[#1A1A1A]">

    <div class="bg-orange-500 text-white text-[10px] tracking-[0.2em] py-2 text-center uppercase font-black">
        <span class="animate-pulse">🔥 FLASH SALES STARTING IN <span id="timer">00:00:00</span> 🔥</span>
    </div>

    <nav class="glass sticky top-0 z-50 border-b border-gray-200">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="#" class="text-xl font-black tracking-tighter flex items-center">
                NANA <span class="bg-orange-500 text-white ml-1 px-2 py-0.5 rounded">OBASTY</span>
            </a>
            
            <div class="flex-1 max-w-xl mx-8 hidden md:block relative">
                <input type="text" id="searchInput" onkeyup="searchProducts()" placeholder="Search products, brands and categories" class="w-full bg-gray-100 border border-gray-300 rounded-lg px-10 py-2 text-sm outline-none focus:ring-2 ring-orange-500/20">
                <span class="material-symbols-outlined absolute left-3 top-2 text-gray-400">search</span>
            </div>

            <div class="flex items-center space-x-6">
                <button onclick="toggleModal()" class="flex items-center gap-1 hover:text-orange-500 transition font-bold text-xs uppercase">
                    <span class="material-symbols-outlined">person</span> <span class="hidden sm:inline">Account</span>
                </button>
                <div class="relative">
                    <button onclick="toggleCart()" class="flex items-center gap-1 hover:text-orange-500 transition font-bold text-xs uppercase">
                        <span class="material-symbols-outlined">shopping_cart</span> <span class="hidden sm:inline">Cart</span>
                    </button>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-orange-500 text-white text-[9px] w-4 h-4 flex items-center justify-center rounded-full font-bold">0</span>
                </div>
            </div>
        </div>
    </nav>

    <section class="bg-white py-6 border-b overflow-x-auto no-scrollbar">
        <div class="container mx-auto px-4 flex justify-between sm:justify-center gap-8 min-w-max">
            <button onclick="filterCat('all')" class="flex flex-col items-center gap-2 group">
                <div class="w-14 h-14 rounded-full bg-gray-100 flex items-center justify-center group-hover:bg-orange-100 transition"><span class="material-symbols-outlined text-orange-500">grid_view</span></div>
                <span class="text-[10px] font-bold uppercase tracking-tight">All</span>
            </button>
            <button onclick="filterCat('tech')" class="flex flex-col items-center gap-2 group">
                <div class="w-14 h-14 rounded-full bg-gray-100 flex items-center justify-center group-hover:bg-orange-100 transition"><span class="material-symbols-outlined text-blue-500">devices</span></div>
                <span class="text-[10px] font-bold uppercase tracking-tight">Phones</span>
            </button>
            <button onclick="filterCat('style')" class="flex flex-col items-center gap-2 group">
                <div class="w-14 h-14 rounded-full bg-gray-100 flex items-center justify-center group-hover:bg-orange-100 transition"><span class="material-symbols-outlined text-purple-500">checkroom</span></div>
                <span class="text-[10px] font-bold uppercase tracking-tight">Fashion</span>
            </button>
            <button onclick="checkAuthAndSell()" class="flex flex-col items-center gap-2 group">
                <div class="w-14 h-14 rounded-full bg-orange-500 flex items-center justify-center shadow-lg shadow-orange-200"><span class="material-symbols-outlined text-white">sell</span></div>
                <span class="text-[10px] font-bold uppercase tracking-tight text-orange-600">Sell Now</span>
            </button>
        </div>
    </section>

    <section class="container mx-auto px-4 mt-8">
        <div class="bg-orange-600 rounded-t-lg p-4 flex justify-between items-center text-white">
            <h2 class="font-bold flex items-center gap-2 uppercase tracking-tighter italic">
                <span class="material-symbols-outlined">bolt</span> Flash Sales
            </h2>
            <a href="#" class="text-xs font-bold hover:underline">SEE ALL ></a>
        </div>

        <div id="product-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-3 bg-white p-4 rounded-b-lg shadow-sm">
            <div class="product-card p-2 hover:shadow-xl transition-all border border-transparent hover:border-gray-100 bg-white" data-category="tech" data-name="Studio Pro">
                <div class="relative mb-3 overflow-hidden rounded-md">
                    <span class="absolute top-2 left-2 bg-orange-100 text-orange-600 text-[9px] font-black px-1.5 py-0.5 rounded z-10">-25%</span>
                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400" class="w-full aspect-square object-cover transition duration-500">
                </div>
                <div class="space-y-1">
                    <p class="text-[10px] text-blue-600 font-bold flex items-center gap-1"><span class="material-symbols-outlined text-[12px]">verified</span> Official Store</p>
                    <h3 class="text-sm truncate font-medium">Studio Pro Wireless</h3>
                    <p class="text-lg font-bold">$399</p>
                    <p class="text-[10px] text-gray-400 line-through">$499</p>
                    <div class="flex items-center text-orange-400 mb-2">
                        <span class="material-symbols-outlined text-sm">star</span><span class="material-symbols-outlined text-sm">star</span><span class="material-symbols-outlined text-sm">star</span>
                        <span class="text-[10px] ml-1 text-gray-400">(45)</span>
                    </div>
                    <button onclick="checkAuthAndAdd('Studio Pro', 399)" class="w-full bg-orange-500 text-white py-2 rounded shadow-md text-xs font-bold uppercase hover:bg-orange-600">Add to Cart</button>
                </div>
            </div>
        </div>
    </section>

    <div id="sell-modal" class="fixed inset-0 bg-black/60 z-[1000] flex items-center justify-center hidden opacity-0">
        <div class="bg-white p-10 rounded-xl w-full max-w-md shadow-2xl relative mx-4">
            <button onclick="toggleSellModal()" class="absolute top-6 right-6 material-symbols-outlined text-gray-400">close</button>
            <h2 class="text-2xl font-black mb-6 uppercase italic">List Item</h2>
            <form class="space-y-4" onsubmit="handleUserAddProduct(event)">
                <input type="text" id="sellerProductName" placeholder="Item Name" class="w-full p-3 bg-gray-50 border rounded-lg outline-none" required>
                <input type="number" id="sellerProductPrice" placeholder="Price (USD)" class="w-full p-3 bg-gray-50 border rounded-lg outline-none" required>
                <select id="sellerProductCategory" class="w-full p-3 bg-gray-50 border rounded-lg outline-none">
                    <option value="tech">Electronics</option>
                    <option value="style">Fashion</option>
                </select>
                <input type="url" id="sellerProductImage" placeholder="Image Link" class="w-full p-3 bg-gray-50 border rounded-lg outline-none" required>
                <button type="submit" class="w-full bg-orange-500 text-white py-4 rounded-lg font-bold uppercase tracking-widest text-[10px]">Post to Shop</button>
            </form>
        </div>
    </div>

    <div id="cart-overlay" class="fixed inset-0 bg-black/40 z-[100] hidden opacity-0" onclick="toggleCart()"></div>
    <div id="cart-sidebar" class="fixed right-0 top-0 h-full w-full max-w-sm bg-white z-[101] cart-sidebar translate-x-full shadow-2xl flex flex-col">
        <div class="p-6 border-b flex justify-between items-center bg-gray-50">
            <h2 class="font-bold uppercase italic flex items-center gap-2"><span class="material-symbols-outlined">shopping_cart</span> Cart</h2>
            <button onclick="toggleCart()" class="material-symbols-outlined">close</button>
        </div>
        <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
        <div class="p-6 border-t">
            <div class="flex justify-between items-center mb-4"><span class="font-bold text-gray-500 uppercase text-xs">Subtotal</span><span id="cart-total" class="text-xl font-black text-orange-500">$0</span></div>
            <button onclick="checkout()" class="w-full bg-orange-500 text-white py-4 rounded font-black uppercase text-xs shadow-lg">Checkout Now</button>
        </div>
    </div>

    <div id="profile-modal" class="fixed inset-0 bg-black/60 z-[1000] flex items-center justify-center hidden opacity-0">
        <div class="bg-white p-10 rounded-xl w-full max-w-md shadow-2xl relative">
            <button onclick="toggleModal()" class="absolute top-4 right-4 material-symbols-outlined">close</button>
            <div id="auth-selection" class="text-center">
                <h2 class="text-2xl font-black mb-8 uppercase italic">My Account</h2>
                <button onclick="showForm('login')" class="w-full bg-black text-white py-4 rounded-full font-bold text-[10px] uppercase tracking-widest mb-4">Login</button>
                <button onclick="showForm('signup')" class="w-full border-2 border-black py-4 rounded-full font-bold text-[10px] uppercase tracking-widest">Sign Up</button>
            </div>
            <div id="login-form" class="hidden-form">
                <button onclick="showForm('selection')" class="text-xs font-bold text-orange-500 mb-4 uppercase">← Back</button>
                <form onsubmit="handleAuthAction('login')">
                    <input type="email" placeholder="Email" class="w-full p-4 bg-gray-50 border rounded-xl mb-3" required>
                    <input type="password" placeholder="Password" class="w-full p-4 bg-gray-50 border rounded-xl mb-4" required>
                    <button class="w-full bg-orange-500 text-white py-4 rounded-xl font-bold uppercase">Sign In</button>
                </form>
            </div>
            <div id="signup-form" class="hidden-form">
                <button onclick="showForm('selection')" class="text-xs font-bold text-orange-500 mb-4 uppercase">← Back</button>
                <form onsubmit="handleAuthAction('signup')">
                    <input type="text" placeholder="Full Name" class="w-full p-4 bg-gray-50 border rounded-xl mb-3" required>
                    <input type="email" placeholder="Email" class="w-full p-4 bg-gray-50 border rounded-xl mb-3" required>
                    <input type="password" placeholder="Password" class="w-full p-4 bg-gray-50 border rounded-xl mb-4" required>
                    <button class="w-full bg-orange-500 text-white py-4 rounded-xl font-bold uppercase">Create Account</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        let cart = [];
        let isLoggedIn = false;

        // FLASH SALE TIMER
        function startTimer() {
            let h = 2, m = 45, s = 0;
            setInterval(() => {
                if(s == 0) { if(m == 0) { h--; m = 59; } else { m--; } s = 59; } else { s--; }
                document.getElementById('timer').innerText = 
                    `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            }, 1000);
        }
        startTimer();

        // AUTH & SELL LOGIC
        function checkAuthAndSell() {
            if (!isLoggedIn) { alert("Please login to sell your products!"); toggleModal(); }
            else { toggleSellModal(); }
        }

        function checkAuthAndAdd(name, price) {
            if (!isLoggedIn) { alert("Login required to add items to cart."); toggleModal(); }
            else { addToCart(name, price); }
        }

        function handleAuthAction(type) {
            event.preventDefault();
            isLoggedIn = true;
            alert("Success! Now you can buy and sell.");
            toggleModal();
        }

        function toggleSellModal() {
            const m = document.getElementById('sell-modal');
            m.classList.toggle('hidden');
            setTimeout(() => m.classList.toggle('opacity-0'), 10);
        }

        function handleUserAddProduct(e) {
            e.preventDefault();
            const name = document.getElementById('sellerProductName').value;
            const price = document.getElementById('sellerProductPrice').value;
            const cat = document.getElementById('sellerProductCategory').value;
            const img = document.getElementById('sellerProductImage').value;

            const grid = document.getElementById('product-grid');
            const card = document.createElement('div');
            card.className = "product-card p-2 hover:shadow-xl bg-white border border-transparent rounded-lg";
            card.setAttribute('data-category', cat);
            card.setAttribute('data-name', name);
            card.innerHTML = `
                <div class="relative mb-3 overflow-hidden rounded-md">
                    <img src="${img}" class="w-full aspect-square object-cover">
                </div>
                <div class="space-y-1">
                    <p class="text-[10px] text-blue-600 font-bold flex items-center gap-1">Seller Item</p>
                    <h3 class="text-sm truncate font-medium">${name}</h3>
                    <p class="text-lg font-bold text-orange-500">$${price}</p>
                    <button onclick="checkAuthAndAdd('${name}', ${price})" class="w-full bg-orange-500 text-white py-2 rounded text-xs font-bold uppercase mt-2">Add to Cart</button>
                </div>
            `;
            grid.appendChild(card);
            toggleSellModal();
            e.target.reset();
        }

        // CORE UI LOGIC
        function toggleModal() {
            const m = document.getElementById('profile-modal');
            m.classList.toggle('hidden');
            setTimeout(() => m.classList.toggle('opacity-0'), 10);
            showForm('selection');
        }

        function showForm(view) {
            document.getElementById('auth-selection').style.display = view === 'selection' ? 'block' : 'none';
            document.getElementById('login-form').style.display = view === 'login' ? 'block' : 'none';
            document.getElementById('signup-form').style.display = view === 'signup' ? 'block' : 'none';
        }

        function toggleCart() {
            const sidebar = document.getElementById('cart-sidebar');
            const overlay = document.getElementById('cart-overlay');
            sidebar.classList.toggle('translate-x-full');
            overlay.classList.toggle('hidden');
            setTimeout(() => overlay.classList.toggle('opacity-0'), 10);
        }

        function addToCart(name, price) {
            cart.push({ name, price: parseFloat(price) });
            updateCart();
            toggleCart();
        }

        function updateCart() {
            const cartItems = document.getElementById('cart-items');
            document.getElementById('cart-count').innerText = cart.length;
            if (cart.length === 0) {
                cartItems.innerHTML = '<p class="text-center text-gray-400 py-10">Empty Cart</p>';
                document.getElementById('cart-total').innerText = '$0';
                return;
            }
            let total = 0;
            cartItems.innerHTML = cart.map((item, index) => {
                total += item.price;
                return `<div class="flex justify-between items-center bg-gray-50 p-3 rounded border">
                    <div><p class="font-bold text-xs uppercase">${item.name}</p><p class="text-orange-500 font-bold">$${item.price}</p></div>
                    <button onclick="removeFromCart(${index})" class="material-symbols-outlined text-gray-400 hover:text-red-500 transition">delete</button>
                </div>`;
            }).join('');
            document.getElementById('cart-total').innerText = '$' + total.toFixed(2);
        }

        function removeFromCart(i) { cart.splice(i, 1); updateCart(); }

        function filterCat(cat) {
            const products = document.querySelectorAll('.product-card');
            products.forEach(p => {
                const category = p.getAttribute('data-category');
                p.style.display = (cat === 'all' || category === cat) ? 'block' : 'none';
            });
        }

        function searchProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const products = document.querySelectorAll('.product-card');
            products.forEach(p => {
                const name = p.getAttribute('data-name').toLowerCase();
                p.style.display = name.includes(query) ? 'block' : 'none';
            });
        }

        function checkout() { alert("Proceeding to Jumia-style Secure Checkout..."); }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanaObasty Pro | Ghana's #1 Trusted Marketplace</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0066FF; --primary-light: #E0EBFF; --accent: #00D094;
            --bg: #F8FAFC; --card: #FFFFFF; --text: #0F172A; --muted: #64748B;
            --border: #E2E8F0; --premium: #FFD700; --danger: #FF4757;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        }
        [data-theme="dark"] {
            --bg: #020617; --card: #0F172A; --text: #F1F5F9; --muted: #94A3B8; --border: #1E293B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); transition: 0.3s; padding-bottom: 90px; overflow-x: hidden; }

        /* --- PRO NAVIGATION --- */
        nav.main-nav {
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px);
            padding: 0.7rem 5%; display: flex; justify-content: space-between;
            align-items: center; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--border);
        }
        .logo { font-weight: 800; font-size: 1.5rem; color: var(--primary); display: flex; align-items: center; gap: 5px; }
        .logo span { color: var(--text); }
        .badge-verified { background: var(--primary); color: white; font-size: 0.6rem; padding: 2px 6px; border-radius: 4px; vertical-align: middle; margin-left: 5px; }

        /* --- FEATURED SECTION --- */
        .section-title { font-size: 1.1rem; font-weight: 800; margin: 20px 5% 10px; display: flex; align-items: center; gap: 10px; }
        .featured-slider { display: flex; gap: 15px; overflow-x: auto; padding: 10px 5% 20px; scrollbar-width: none; }
        .featured-slider::-webkit-scrollbar { display: none; }
        .featured-card { 
            min-width: 280px; background: var(--card); border-radius: 20px; 
            border: 2px solid var(--premium); overflow: hidden; position: relative; flex-shrink: 0;
        }
        .premium-tag { position: absolute; top: 10px; left: 10px; background: var(--premium); color: #000; font-size: 0.7rem; font-weight: 800; padding: 4px 8px; border-radius: 6px; }

        /* --- GRID & CARDS --- */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; padding: 0 5%; }
        .pro-card { 
            background: var(--card); border-radius: 18px; border: 1px solid var(--border); 
            overflow: hidden; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; position: relative;
        }
        .pro-card:hover { transform: translateY(-5px); box-shadow: var(--shadow); }
        .pro-img { height: 150px; background-size: cover; background-position: center; position: relative; }
        .pro-info { padding: 12px; }
        .pro-price { color: var(--primary); font-weight: 800; font-size: 1rem; margin-top: 4px; }
        .pro-condition { font-size: 0.65rem; background: var(--primary-light); color: var(--primary); padding: 2px 6px; border-radius: 4px; font-weight: 700; }

        /* --- PROFESSIONAL DASHBOARD --- */
        .dashboard-container { display: none; padding: 20px 5%; max-width: 1000px; margin: 0 auto; animation: slideUp 0.4s ease; }
        .analytics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .analytic-item { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid var(--border); text-align: center; }
        .analytic-item h4 { font-size: 1.5rem; color: var(--primary); }
        .analytic-item p { font-size: 0.75rem; color: var(--muted); font-weight: 600; }

        /* --- FORMS & UI --- */
        .search-container { padding: 15px 5%; background: var(--card); border-bottom: 1px solid var(--border); }
        .search-bar { display: flex; gap: 10px; background: var(--bg); padding: 8px 15px; border-radius: 14px; border: 1px solid var(--border); }
        .search-bar input { border: none; background: transparent; width: 100%; outline: none; color: var(--text); font-size: 0.9rem; }
        
        .filter-row { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
        .filter-btn { padding: 6px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); font-size: 0.8rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* --- MODALS --- */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .modal.active { display: flex; }
        .modal-box { background: var(--card); padding: 30px; border-radius: 28px; width: 100%; max-width: 450px; position: relative; }
        
        /* --- BUTTONS --- */
        .btn-pro { background: var(--primary); color: white; border: none; padding: 14px 28px; border-radius: 16px; font-weight: 700; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn-pro:hover { opacity: 0.9; transform: scale(0.98); }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--card); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid var(--border); z-index: 1000; }
        .nav-link { color: var(--muted); text-decoration: none; font-size: 0.7rem; font-weight: 700; text-align: center; }
        .nav-link.active { color: var(--primary); }
        .nav-link i { font-size: 1.4rem; display: block; margin-bottom: 4px; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <nav class="main-nav">
        <div class="logo" onclick="showView('buy')">Nana<span>Obasty</span></div>
        <div style="display: flex; gap: 10px;">
            <button onclick="toggleTheme()" style="background:none; border:none; font-size:1.2rem; cursor:pointer;">🌓</button>
            <div id="userAvatar" onclick="showView('profile')" style="width:35px; height:35px; background:var(--primary); color:white; border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:800; cursor:pointer;">?</div>
        </div>
    </nav>

    <div id="buyView">
        <div class="search-container">
            <div class="search-bar">
                <span>🔍</span>
                <input type="text" id="mainSearch" placeholder="What are you looking for today?">
            </div>
            <div class="filter-row">
                <button class="filter-btn active" onclick="filterCat('All', this)">All</button>
                <button class="filter-btn" onclick="filterCat('Electronics', this)">📱 Electronics</button>
                <button class="filter-btn" onclick="filterCat('Vehicles', this)">🚗 Vehicles</button>
                <button class="filter-btn" onclick="filterCat('Property', this)">🏠 Property</button>
                <button class="filter-btn" onclick="filterCat('Fashion', this)">👕 Fashion</button>
            </div>
        </div>

        <h3 class="section-title">⭐ Featured Listings</h3>
        <div class="featured-slider" id="featuredGrid">
            </div>

        <h3 class="section-title">Recent Ads</h3>
        <div class="product-grid" id="productGrid">
            </div>
    </div>

    <div id="sellView" style="display:none; padding: 20px 5%; max-width:600px; margin:0 auto;">
        <div style="background:var(--card); padding:30px; border-radius:28px; border:1px solid var(--border);">
            <h2 style="margin-bottom:20px;">List a New Item</h2>
            <form id="listingForm">
                <input type="text" id="pName" placeholder="Item Name" required style="width:100%; padding:15px; border-radius:12px; border:1px solid var(--border); margin-bottom:15px;">
                <div style="display:flex; gap:10px; margin-bottom:15px;">
                    <input type="number" id="pPrice" placeholder="Price (₵)" required style="flex:1; padding:15px; border-radius:12px; border:1px solid var(--border);">
                    <select id="pCondition" style="flex:1; padding:15px; border-radius:12px; border:1px solid var(--border);">
                        <option>New</option><option>Home Used</option><option>Refurbished</option>
                    </select>
                </div>
                <select id="pCategory" style="width:100%; padding:15px; border-radius:12px; border:1px solid var(--border); margin-bottom:15px;">
                    <option>Electronics</option><option>Vehicles</option><option>Property</option><option>Fashion</option>
                </select>
                <input type="file" id="pImage" accept="image/*" required style="margin-bottom:20px;">
                <button type="submit" class="btn-pro">Deploy Listing</button>
            </form>
        </div>
    </div>

    <div id="profileView" class="dashboard-container">
        <div style="display:flex; align-items:center; gap:20px; background:var(--card); padding:25px; border-radius:24px; border:1px solid var(--border); margin-bottom:25px;">
            <div style="width:70px; height:70px; background:var(--primary); border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:1.8rem; color:white; font-weight:800;" id="dashInitial">U</div>
            <div>
                <h2 id="dashName">Pro Seller <span class="badge-verified">VERIFIED</span></h2>
                <p style="color:var(--muted); font-size:0.85rem;" id="dashEmail">Loading...</p>
                <button onclick="logout()" style="border:none; background:none; color:var(--danger); font-weight:800; cursor:pointer; font-size:0.8rem;">Logout</button>
            </div>
        </div>

        <div class="analytics-grid">
            <div class="analytic-item"><h4 id="countAds">0</h4><p>Live Ads</p></div>
            <div class="analytic-item"><h4 id="countViews">0</h4><p>Total Views</p></div>
            <div class="analytic-item"><h4 id="countTrust">100%</h4><p>Trust Score</p></div>
        </div>

        <h3 style="margin-bottom:15px;">Your Active Inventory</h3>
        <div id="userItemsList"></div>
    </div>

    <div id="authModal" class="modal">
        <div class="modal-box">
            <h2 style="margin-bottom:10px;">Get Started</h2>
            <p style="color:var(--muted); font-size:0.85rem; margin-bottom:20px;">Join 5,000+ verified sellers in Ghana.</p>
            <input type="email" id="email" placeholder="Email Address" style="width:100%; padding:15px; border-radius:12px; border:1px solid var(--border); margin-bottom:12px;">
            <input type="password" id="pass" placeholder="Password" style="width:100%; padding:15px; border-radius:12px; border:1px solid var(--border); margin-bottom:20px;">
            <button onclick="authAction()" class="btn-pro">Continue</button>
            <button onclick="closeAuth()" style="width:100%; margin-top:10px; background:none; border:none; color:var(--muted); cursor:pointer;">Maybe Later</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-link active" onclick="showView('buy')"><i>🏠</i>Explore</div>
        <div class="nav-link" onclick="showView('sell')"><i>➕</i>Sell</div>
        <div class="nav-link" onclick="showView('profile')"><i>👤</i>Dashboard</div>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NANA OBASTY ELITE | Luxury Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,1&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #C5A059; --dark: #0d0d0d; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--dark); color: #fff; scroll-behavior: smooth; }
        .gold-text { color: var(--accent); }
        .bg-gold { background: var(--accent); }
        .glass-nav { background: rgba(13, 13, 13, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid #222; }
        .product-card { background: #161616; border: 1px solid #222; transition: all 0.4s ease; border-radius: 24px; overflow: hidden; }
        .product-card:hover { border-color: var(--accent); transform: translateY(-5px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .stat-card { background: #161616; border: 1px solid #222; border-radius: 20px; }
        #product-page { display: none; min-height: 100vh; background: var(--dark); z-index: 2000; position: absolute; top: 0; left: 0; width: 100%; }
    </style>
</head>
<body>

    <nav class="glass-nav sticky top-0 z-[100] px-6 py-4">
        <div class="container mx-auto flex justify-between items-center">
            <a href="javascript:location.reload()" class="text-2xl font-black tracking-tighter flex items-center gap-2">
                NANA OBASTY <span class="bg-gold text-black px-2 py-0.5 rounded italic text-xl">ELITE</span>
            </a>
            <div class="flex items-center space-x-6">
                <button onclick="window.toggleModal()" id="user-display" class="text-[11px] font-black uppercase tracking-widest">Sign In</button>
                <span class="material-symbols-outlined text-2xl cursor-pointer hover:text-gold" onclick="window.checkAuthAndSell()">add_circle</span>
            </div>
        </div>
    </nav>

    <div id="home-view">
        <section class="container mx-auto px-6 pt-10 grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="stat-card p-6 border-l-4 border-gold">
                <p class="text-[9px] font-black uppercase tracking-widest text-gray-500 mb-1">Elite Inventory</p>
                <h4 id="stat-count" class="text-2xl font-black italic">0</h4>
            </div>
            <div class="stat-card p-6 border-l-4 border-white/10">
                <p class="text-[9px] font-black uppercase tracking-widest text-gray-500 mb-1">Market Value</p>
                <h4 id="stat-value" class="text-2xl font-black italic text-gold">$0</h4>
            </div>
        </section>

        <section class="container mx-auto px-6 py-8 flex gap-4 overflow-x-auto no-scrollbar">
            <button onclick="window.filterCat('all')" class="px-8 py-3 rounded-full bg-gold text-black font-black text-[10px] uppercase tracking-widest">All</button>
            <button onclick="window.filterCat('tech')" class="px-8 py-3 rounded-full bg-[#1a1a1a] border border-[#333] font-bold text-[10px] uppercase tracking-widest">Tech</button>
            <button onclick="window.filterCat('style')" class="px-8 py-3 rounded-full bg-[#1a1a1a] border border-[#333] font-bold text-[10px] uppercase tracking-widest">Fashion</button>
        </section>

        <main class="container mx-auto px-6 pb-20">
            <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"></div>
        </main>
    </div>

    <div id="product-page" class="animate-in fade-in duration-500">
        <div class="container mx-auto px-6 py-10">
            <button onclick="window.closeProductPage()" class="mb-8 flex items-center gap-2 text-gray-400 hover:text-gold transition font-bold uppercase text-xs">
                <span class="material-symbols-outlined">arrow_back</span> Back to Gallery
            </button>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-16 items-start">
                <div class="rounded-[40px] overflow-hidden bg-[#161616] border border-white/5 sticky top-28">
                    <img id="view-img" src="" class="w-full aspect-square object-cover">
                </div>

                <div class="space-y-10">
                    <div>
                        <span id="view-cat" class="text-gold font-black text-xs uppercase tracking-[0.3em]"></span>
                        <h1 id="view-name" class="text-5xl font-black uppercase mt-4 tracking-tighter leading-none"></h1>
                        <p id="view-price" class="text-4xl text-gray-400 mt-6 font-light"></p>
                    </div>

                    <div class="p-8 rounded-3xl bg-[#161616] border border-white/5 space-y-4">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full bg-gold/10 flex items-center justify-center">
                                <span class="material-symbols-outlined gold-text">verified_user</span>
                            </div>
                            <div>
                                <p class="text-[10px] text-gray-500 uppercase font-black tracking-widest">Official Seller</p>
                                <p class="font-bold">Nana Obasty Elite</p>
                            </div>
                        </div>
                        <p class="text-sm text-gray-400 leading-relaxed italic">This item has been inspected for quality and authenticity by the Elite curation team.</p>
                    </div>

                    <div class="flex gap-4">
                        <a id="view-wa-btn" href="#" target="_blank" class="flex-1 bg-[#25D366] text-white py-6 rounded-2xl font-black uppercase text-center hover:scale-[1.02] transition-transform">
                            Contact via WhatsApp
                        </a>
                    </div>
                </div>
            </div>

            <div class="mt-32">
                <h3 class="text-2xl font-black uppercase italic mb-8">You May Also Like</h3>
                <div id="similar-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"></div>
            </div>
        </div>
    </div>

    <div id="auth-modal" class="fixed inset-0 bg-black/95 z-[3000] hidden flex items-center justify-center p-4">
        <div class="bg-[#161616] w-full max-w-md rounded-[40px] p-10 border border-[#333] relative">
            <button onclick="window.toggleModal()" class="absolute top-8 right-8 material-symbols-outlined">close</button>
            <form id="authForm" class="space-y-4">
                <h2 class="text-3xl font-black uppercase mb-8 gold-text italic">Elite Access</h2>
                <input type="email" id="authEmail" placeholder="Email" class="w-full p-5 bg-[#0d0d0d] border border-[#333] rounded-2xl text-white outline-none">
                <input type="password" id="authPass" placeholder="Password" class="w-full p-5 bg-[#0d0d0d] border border-[#333] rounded-2xl text-white outline-none">
                <button type="submit" class="w-full bg-gold text-black py-5 rounded-2xl font-black uppercase tracking-widest">Enter</button>
            </form>
        </div>
    </div>

    <div id="sell-modal" class="fixed inset-0 bg-black/95 z-[3000] hidden flex items-center justify-center p-4">
        <div class="bg-[#161616] w-full max-w-md rounded-[40px] p-10 border border-[#333] relative">
            <button onclick="window.toggleSellModal()" class="absolute top-8 right-8 material-symbols-outlined">close</button>
            <form id="sellForm" class="space-y-4">
                <h2 class="text-3xl font-black uppercase mb-8 gold-text italic">List Luxury</h2>
                <input type="text" id="pName" placeholder="Item Name" class="w-full p-4 bg-[#0d0d0d] border border-[#333] rounded-xl text-white outline-none" required>
                <input type="number" id="pPrice" placeholder="Price ($)" class="w-full p-4 bg-[#0d0d0d] border border-[#333] rounded-xl text-white outline-none" required>
                <input type="tel" id="pPhone" value="233539547368" class="w-full p-4 bg-[#0d0d0d] border border-[#333] rounded-xl text-white outline-none" required>
                <select id="pCat" class="w-full p-4 bg-[#0d0d0d] border border-[#333] rounded-xl text-gray-400 outline-none">
                    <option value="tech">Technology</option>
                    <option value="style">Fashion</option>
                </select>
                <input type="file" id="pFile" accept="image/*" class="w-full p-4 bg-[#0d0d0d] border border-[#333] rounded-xl text-white outline-none" required>
                <button type="submit" id="sellSubmitBtn" class="w-full bg-gold text-black py-5 rounded-2xl font-black uppercase tracking-widest">Post Live</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDyC4uyc10cXAFOESh4DSUSPXJN4EgVy_I",
            authDomain: "obasty-market.firebaseapp.com",
            projectId: "obasty-market",
            storageBucket: "obasty-market.firebasestorage.app",
            messagingSenderId: "753490577388",
            appId: "1:753490577388:web:b091a8f4ba9d88c0e662c9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const storage = getStorage(app);
        const pRef = collection(db, "products");

        let allProducts = [];
        window.isLoggedIn = false;

        onAuthStateChanged(auth, (user) => {
            window.isLoggedIn = !!user;
            document.getElementById('user-display').innerText = user ? "ELITE ADMIN" : "SIGN IN";
        });

        window.toggleModal = () => document.getElementById('auth-modal').classList.toggle('hidden');
        window.toggleSellModal = () => document.getElementById('sell-modal').classList.toggle('hidden');

        document.getElementById('authForm').onsubmit = async (e) => {
            e.preventDefault();
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('authEmail').value, document.getElementById('authPass').value);
                window.toggleModal();
            } catch(err) { alert("Access Denied"); }
        };

        document.getElementById('sellForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('sellSubmitBtn');
            const file = document.getElementById('pFile').files[0];
            try {
                btn.innerText = "UPLOADING..."; btn.disabled = true;
                const fileRef = sRef(storage, `products/${Date.now()}_${file.name}`);
                const snapshot = await uploadBytes(fileRef, file);
                const url = await getDownloadURL(snapshot.ref);
                await addDoc(pRef, {
                    name: document.getElementById('pName').value,
                    price: parseFloat(document.getElementById('pPrice').value),
                    phone: document.getElementById('pPhone').value,
                    category: document.getElementById('pCat').value,
                    image: url,
                    sellerEmail: auth.currentUser.email,
                    createdAt: Date.now()
                });
                window.toggleSellModal();
                e.target.reset();
            } catch (err) { alert("Error uploading"); }
            finally { btn.innerText = "POST LIVE"; btn.disabled = false; }
        };

        window.viewProduct = (id) => {
            const p = allProducts.find(item => item.id === id);
            if (!p) return;

            document.getElementById('home-view').style.display = 'none';
            document.getElementById('product-page').style.display = 'block';
            window.scrollTo(0,0);

            document.getElementById('view-img').src = p.image;
            document.getElementById('view-name').innerText = p.name;
            document.getElementById('view-cat').innerText = p.category;
            document.getElementById('view-price').innerText = `$${p.price.toLocaleString()}`;
            
            const msg = encodeURIComponent(`Hello, I'm interested in the ${p.name} ($${p.price}) on Nana Obasty Elite.`);
            document.getElementById('view-wa-btn').href = `https://wa.me/${p.phone}?text=${msg}`;

            // Load Similar
            const similar = allProducts.filter(item => item.category === p.category && item.id !== p.id).slice(0, 4);
            const simGrid = document.getElementById('similar-grid');
            simGrid.innerHTML = similar.map(item => createCardHTML(item)).join('');
        };

        window.closeProductPage = () => {
            document.getElementById('home-view').style.display = 'block';
            document.getElementById('product-page').style.display = 'none';
        };

        window.deleteProduct = async (e, id) => {
            e.stopPropagation();
            if (confirm("Remove this item?")) {
                await deleteDoc(doc(db, "products", id));
            }
        };

        function createCardHTML(p) {
            const isOwner = auth.currentUser && auth.currentUser.email === p.sellerEmail;
            return `
                <div class="product-card cursor-pointer" onclick="window.viewProduct('${p.id}')">
                    <div class="h-72 relative">
                        ${isOwner ? `<button onclick="window.deleteProduct(event, '${p.id}')" class="absolute top-4 left-4 z-10 bg-red-600 p-2 rounded-full"><span class="material-symbols-outlined text-sm">delete</span></button>` : ''}
                        <img src="${p.image}" class="w-full h-full object-cover">
                    </div>
                    <div class="p-6">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-bold text-gray-200 truncate w-3/4">${p.name}</h3>
                            <p class="text-gold font-black">$${p.price.toLocaleString()}</p>
                        </div>
                        <p class="text-[9px] uppercase tracking-widest text-gray-500 font-black">${p.category}</p>
                    </div>
                </div>`;
        }

        onSnapshot(query(pRef, orderBy("createdAt", "desc")), (snap) => {
            const grid = document.getElementById('product-grid');
            allProducts = [];
            let total = 0;
            
            snap.forEach(ds => {
                const data = {id: ds.id, ...ds.data()};
                allProducts.push(data);
                total += data.price;
            });

            grid.innerHTML = allProducts.map(p => createCardHTML(p)).join('');
            document.getElementById('stat-count').innerText = allProducts.length;
            document.getElementById('stat-value').innerText = `$${total.toLocaleString()}`;
        });

        window.filterCat = (cat) => {
            const filtered = cat === 'all' ? allProducts : allProducts.filter(p => p.category === cat);
            document.getElementById('product-grid').innerHTML = filtered.map(p => createCardHTML(p)).join('');
        };

        window.checkAuthAndSell = () => window.isLoggedIn ? window.toggleSellModal() : window.toggleModal();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanaObasty | Premium Marketplace</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --accent: #6366f1;
            --bg: #fcfcfd;
            --card-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg); color: #1a1f2e; padding-bottom: 100px; }

        /* --- PREMIUM HEADER --- */
        header {
            position: sticky; top: 0; z-index: 1000;
            background: rgba(252, 252, 253, 0.8);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 20px 6%; display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 22px; font-weight: 800; letter-spacing: -1px; background: var(--brand); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .profile-icon { 
            width: 40px; height: 40px; background: white; border-radius: 14px; 
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; cursor: pointer;
        }

        /* --- HERO SEARCH --- */
        .hero { padding: 40px 6% 20px; text-align: left; }
        .hero h1 { font-size: 36px; font-weight: 800; line-height: 1.2; color: #0f172a; margin-bottom: 25px; }
        
        .search-container {
            background: white; padding: 8px 8px 8px 20px; border-radius: 20px;
            display: flex; align-items: center; box-shadow: var(--card-shadow);
            border: 1px solid #f1f5f9;
        }
        .search-container input { border: none; outline: none; width: 100%; font-size: 16px; font-weight: 500; }
        .search-btn { 
            background: #1a1f2e; color: white; border: none; 
            padding: 12px 20px; border-radius: 14px; font-weight: 600; cursor: pointer; 
        }

        /* --- VIEW TRANSITIONS --- */
        .view { display: none; animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .view.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* --- PRODUCT CARDS --- */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 20px; padding: 20px 6%; }
        
        .card { 
            background: white; border-radius: 24px; padding: 10px; 
            box-shadow: var(--card-shadow); transition: all 0.3s ease; border: 1px solid #f8fafc;
        }
        .card:hover { transform: translateY(-10px); box-shadow: 0 30px 40px rgba(0,0,0,0.08); }
        .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 18px; margin-bottom: 12px; }
        
        .card-info { padding: 5px; }
        .card-price { font-size: 18px; font-weight: 800; color: #1a1f2e; display: block; }
        .card-title { font-size: 13px; color: #64748b; font-weight: 500; margin-top: 4px; }

        /* --- PRO FORM --- */
        .form-card { max-width: 500px; margin: 20px auto; background: white; padding: 30px; border-radius: 30px; box-shadow: var(--card-shadow); }
        .input-group { margin-bottom: 20px; }
        .input-group label { font-size: 12px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; display: block; }
        input, select, textarea { 
            width: 100%; padding: 16px; border-radius: 16px; border: 1px solid #f1f5f9; 
            background: #f8fafc; font-size: 15px; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--accent); background: white; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }

        /* --- FLOATING NAV BAR --- */
        .navbar {
            position: fixed; bottom: 25px; left: 5%; right: 5%; height: 70px;
            background: rgba(26, 31, 46, 0.95); backdrop-filter: blur(10px);
            border-radius: 24px; display: flex; justify-content: space-around; align-items: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3); z-index: 2000;
        }
        .nav-item { color: rgba(255,255,255,0.5); text-align: center; font-size: 10px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: white; }
        .nav-item svg { display: block; margin: 0 auto 4px; width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2.2; }

        /* --- BUTTONS --- */
        .btn-primary { background: var(--brand); color: white; border: none; padding: 18px; border-radius: 18px; width: 100%; font-weight: 700; cursor: pointer; font-size: 16px; }
        .btn-call { background: #f1f5f9; border: none; padding: 10px; border-radius: 12px; width: 100%; margin-top: 10px; font-weight: 700; cursor: pointer; color: #1a1f2e; }

    </style>
</head>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NANA OBASTY | Full Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
        .cart-sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .product-card:hover img { transform: scale(1.05); }
    </style>
</head>
<body class="bg-[#FDFDFD] text-[#1A1A1A]">

    <nav class="glass sticky top-0 z-[100] border-b border-gray-100">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-extrabold tracking-tighter">NANA <span class="bg-[#111] text-white px-2 rounded">OBASTY</span></a>
            
            <div class="hidden md:flex flex-1 max-w-md mx-10 relative">
                <span class="material-symbols-outlined absolute left-3 top-2.5 text-gray-400">search</span>
                <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="Search luxury goods..." class="w-full bg-gray-100 py-2.5 pl-10 pr-4 rounded-full text-sm outline-none focus:ring-2 ring-[#C5A059]/20">
            </div>

            <div class="flex items-center space-x-6">
                <button onclick="toggleModal()" class="material-symbols-outlined text-[26px]">account_circle</button>
                <button onclick="toggleCart()" class="relative">
                    <span class="material-symbols-outlined text-[26px]">shopping_bag</span>
                    <span id="cartCount" class="absolute -top-1 -right-1 bg-[#C5A059] text-white text-[9px] w-4 h-4 flex items-center justify-center rounded-full font-bold">0</span>
                </button>
            </div>
        </div>
    </nav>

    <div id="cartOverlay" class="fixed inset-0 bg-black/40 z-[200] hidden opacity-0 transition-opacity" onclick="toggleCart()"></div>
    <div id="cartSidebar" class="fixed right-0 top-0 h-full w-full max-w-md bg-white z-[201] cart-sidebar translate-x-full shadow-2xl flex flex-col">
        <div class="p-6 border-b flex justify-between items-center">
            <h2 class="text-xl font-extrabold uppercase tracking-tight">Your Bag</h2>
            <button onclick="toggleCart()" class="material-symbols-outlined">close</button>
        </div>
        <div id="cartItems" class="flex-1 overflow-y-auto p-6 space-y-6">
            <p class="text-gray-400 text-center mt-10 italic">Your bag is currently empty.</p>
        </div>
        <div class="p-6 border-t bg-gray-50">
            <div class="flex justify-between mb-4 font-bold text-lg">
                <span>Total</span>
                <span id="cartTotal">$0.00</span>
            </div>
            <button onclick="startCheckout()" id="checkoutBtn" class="w-full bg-black text-white py-4 rounded-full font-bold uppercase tracking-widest text-xs disabled:bg-gray-300">Proceed to Checkout</button>
        </div>
    </div>

    <main class="container mx-auto px-6 py-12">
        <div class="flex space-x-4 mb-12 overflow-x-auto pb-2">
            <button onclick="filterCat('all')" class="px-6 py-2 bg-black text-white rounded-full text-xs font-bold uppercase tracking-widest">All</button>
            <button onclick="filterCat('tech')" class="px-6 py-2 border rounded-full text-xs font-bold uppercase tracking-widest hover:bg-gray-100">Technology</button>
            <button onclick="filterCat('style')" class="px-6 py-2 border rounded-full text-xs font-bold uppercase tracking-widest hover:bg-gray-100">Style</button>
        </div>

        <div id="productGrid" class="grid grid-cols-1 md:grid-cols-3 gap-10">
            <div class="product-card group" data-category="tech" data-name="Obasty Studio Pro">
                <div class="relative rounded-3xl overflow-hidden aspect-[4/5] bg-gray-100 mb-4">
                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=800" class="w-full h-full object-cover transition duration-700">
                    <button onclick="addToCart('Obasty Studio Pro', 399)" class="absolute bottom-4 left-4 right-4 bg-white/90 backdrop-blur py-3 rounded-2xl font-bold text-xs uppercase translate-y-12 group-hover:translate-y-0 transition">Add to Bag</button>
                </div>
                <h3 class="font-bold text-lg">Obasty Studio Pro</h3>
                <p class="text-[#C5A059] font-extrabold">$399</p>
            </div>

            <div class="product-card group" data-category="style" data-name="Executive Gold Watch">
                <div class="relative rounded-3xl overflow-hidden aspect-[4/5] bg-gray-100 mb-4">
                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=800" class="w-full h-full object-cover transition duration-700">
                    <button onclick="addToCart('Executive Gold Watch', 850)" class="absolute bottom-4 left-4 right-4 bg-white/90 backdrop-blur py-3 rounded-2xl font-bold text-xs uppercase translate-y-12 group-hover:translate-y-0 transition">Add to Bag</button>
                </div>
                <h3 class="font-bold text-lg">Executive Gold Watch</h3>
                <p class="text-[#C5A059] font-extrabold">$850</p>
            </div>
        </div>
    </main>

    <script>
        let cart = [];

        function toggleCart() {
            const sidebar = document.getElementById('cartSidebar');
            const overlay = document.getElementById('cartOverlay');
            const isOpen = sidebar.classList.contains('translate-x-full');
            
            if(isOpen) {
                sidebar.classList.remove('translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            } else {
                sidebar.classList.add('translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 400);
            }
        }

        function addToCart(name, price) {
            cart.push({ name, price });
            updateCartUI();
            toggleCart();
        }

        function updateCartUI() {
            const container = document.getElementById('cartItems');
            const count = document.getElementById('cartCount');
            const total = document.getElementById('cartTotal');
            
            count.innerText = cart.length;
            
            if(cart.length === 0) {
                container.innerHTML = `<p class="text-gray-400 text-center mt-10 italic">Your bag is currently empty.</p>`;
                total.innerText = "$0.00";
                return;
            }

            let sum = 0;
            container.innerHTML = cart.map((item, index) => {
                sum += item.price;
                return `
                <div class="flex justify-between items-center bg-gray-50 p-4 rounded-2xl">
                    <div>
                        <p class="font-bold text-sm">${item.name}</p>
                        <p class="text-[#C5A059] font-bold text-xs">$${item.price}</p>
                    </div>
                    <button onclick="removeItem(${index})" class="material-symbols-outlined text-gray-400 text-sm">delete</button>
                </div>`;
            }).join('');
            
            total.innerText = `$${sum.toFixed(2)}`;
        }

        function removeItem(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function filterProducts() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.product-card');
            
            cards.forEach(card => {
                const name = card.getAttribute('data-name').toLowerCase();
                card.style.display = name.includes(input) ? "block" : "none";
            });
        }

        function filterCat(cat) {
            const cards = document.querySelectorAll('.product-card');
            cards.forEach(card => {
                if(cat === 'all' || card.getAttribute('data-category') === cat) {
                    card.style.display = "block";
                } else {
                    card.style.display = "none";
                }
            });
        }

        function startCheckout() {
            if(cart.length > 0) {
                alert("Redirecting to Secure Payment Gateway...");
                // In a real site, you'd send 'cart' data to Stripe or Paystack here
            }
        }
    </script>
</body>
</html>

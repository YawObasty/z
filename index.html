<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanaObasty | Ghana's Modern Marketplace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #006aff; /* Trust Blue */
            --accent: #00D094;
            --bg: #F0F2F5; /* Soft light grey */
            --surface: #FFFFFF;
            --text-main: #1C1E21;
            --text-muted: #65676B;
            --border: #E4E6EB;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text-main); line-height: 1.5; padding-bottom: 90px; }

        /* --- GLOBAL ICON SYSTEL (Sharp SVGs) --- */
        .icon { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; vertical-align: middle; }

        /* --- PROFESSIONAL HEADER --- */
        header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 12px 6%; display: flex; justify-content: space-between;
            align-items: center; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--border);
        }
        .logo { font-size: 22px; font-weight: 800; text-decoration: none; color: var(--text-main); letter-spacing: -1px; }
        .logo span { color: var(--primary); }
        .user-btn { width: 40px; height: 40px; background: #EEF2FF; border-radius: 50%; color: var(--primary); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .user-btn:hover { background: #E0E7FF; }

        /* --- SEARCH & CATEGORY BAR (Bento Style) --- */
        .hero-banner { padding: 40px 6% 10px; text-align: center; }
        .search-container {
            max-width: 700px; margin: 0 auto 30px;
            background: var(--surface); padding: 8px 10px; border-radius: 100px;
            display: flex; gap: 10px; align-items: center; border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .search-container input { border: none; background: transparent; width: 100%; outline: none; font-size: 16px; font-weight: 500; color: var(--text-main); }
        .search-btn { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 100px; font-weight: 600; cursor: pointer; }

        /* --- PRODUCT GRID --- */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 20px; padding: 10px 6%; 
        }

        .pro-card {
            background: var(--surface); border-radius: 16px; 
            border: 1px solid var(--border); overflow: hidden;
            transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1); cursor: pointer;
        }
        .pro-card:hover { transform: translateY(-8px); box-shadow: 0 20px 30px rgba(0,0,0,0.1); border-color: var(--primary); }

        .card-img-box { height: 160px; overflow: hidden; background: #f0f2f5; }
        .card-img-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .card-body { padding: 15px; }
        .card-price { font-size: 18px; font-weight: 700; color: var(--text-main); margin-bottom: 5px; }
        .card-title { font-size: 14px; font-weight: 500; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .btn-call {
            width: 100%; padding: 10px; margin-top: 15px; background: white; 
            border: 1px solid var(--primary); color: var(--primary); 
            border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.2s;
        }
        .btn-call:hover { background: var(--primary); color: white; }

        /* --- FORMS (Single Column Pro) --- */
        .view { display: none; padding: 20px 6%; animation: fadeIn 0.4s ease; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

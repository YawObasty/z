<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanaObasty Marketplace | Koforidua</title>
    <style>
        /* --- GLOBAL STYLES --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { line-height: 1.6; color: #333; background-color: #f4f7f6; scroll-behavior: smooth; }
        a { text-decoration: none; }

        /* --- NAVIGATION --- */
        nav.top-nav { background: #1a2a3a; color: #fff; padding: 1rem 10%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 1.4rem; font-weight: bold; color: #4db8ff; letter-spacing: 1px; }
        .nav-links { list-style: none; display: flex; align-items: center; }
        .nav-links li { margin-left: 20px; }
        .nav-links a { color: #fff; font-size: 0.9rem; transition: 0.3s; cursor: pointer; }

        /* --- HERO --- */
        header { 
            background: linear-gradient(rgba(26, 42, 58, 0.75), rgba(26, 42, 58, 0.75)), url('photo_10_2026-02-26_13-58-16.jpg');
            background-size: cover; background-position: center; height: 60vh; color: #fff; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 20px; 
        }
        header h1 { font-size: 2.8rem; margin-bottom: 10px; }

        /* --- SEARCH & MARKET --- */
        .search-container { padding: 20px 10%; background: #fff; border-bottom: 1px solid #eee; }
        .search-bar { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        .marketplace { padding: 40px 10%; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; }
        .product-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .product-img { height: 180px; background-size: cover; background-position: center; }
        .product-info { padding: 15px; }

        /* --- UI ELEMENTS --- */
        .btn { background: #4db8ff; color: #fff; padding: 10px 20px; border-radius: 5px; font-weight: bold; border: none; cursor: pointer; display: inline-block; }
        .btn-wa { background: #25D366; margin-top: 15px; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 3000; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: #fff; padding: 30px; border-radius: 15px; max-width: 400px; width: 90%; text-align: center; }
        .auth-form { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .auth-form input, .sell-form input, .sell-form textarea, .sell-form select { padding: 10px; width: 100%; border: 1px solid #ddd; border-radius: 5px; }

        /* --- MOBILE NAV --- */
        .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; border-top: 1px solid #eee; z-index: 2000; justify-content: space-around; padding: 10px 0; }
        @media (max-width: 768px) { .bottom-nav { display: flex; } .nav-links { display: none; } body { padding-bottom: 70px; } }
    </style>
</head>
<body>

    <nav class="top-nav">
        <div class="logo">NANAOBASTY</div>
        <ul class="nav-links">
            <li><a href="#buy">Explore</a></li>
            <li><a href="#sell">Sell</a></li>
            <li><a href="javascript:void(0)" onclick="openAuth()" class="login-trigger">Login</a></li>
        </ul>
    </nav>

    <header>
        <h1>NanaObasty Marketplace</h1>
        <p>The #1 site for deals in Koforidua.</p>
        <button id="shareBtnMain" class="btn btn-wa">📲 Share Marketplace on WhatsApp</button>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-bar" placeholder="What are you looking for?">
    </div>

    <section class="marketplace" id="buy">
        <div id="publicListingGrid" class="product-grid"></div>
    </section>

    <section style="padding: 60px 10%; background: #fff;" id="sell">
        <h2 style="text-align: center; margin-bottom: 20px;">Post an Item</h2>
        <form class="sell-form" id="sellForm" style="max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px;">
            <input type="text" id="itemName" placeholder="Item Name" required>
            <input type="number" id="itemPrice" placeholder="Price (GHS)" required>
            <select id="itemCat"><option>Electronics</option><option>Fashion</option><option>Home</option></select>
            <input type="file" id="itemImage" accept="image/*" required>
            <textarea id="itemDesc" placeholder="Brief description + Your WhatsApp number" rows="3"></textarea>
            <button type="submit" id="publishBtn" class="btn">Publish Now</button>
        </form>
    </section>

    <div id="authModal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="authTitle">Join Marketplace</h3>
            <div id="authFields">
                <form id="registerForm" class="auth-form">
                    <input type="text" id="rName" placeholder="Your Name" required>
                    <button type="submit" class="btn">Create Account</button>
                </form>
            </div>
            <div id="logoutSection" style="display:none;">
                <p id="userWelcome"></p>
                <button onclick="logout()" class="btn" style="background:red; margin-top:10px;">Logout</button>
            </div>
            <button onclick="closeAuth()" style="margin-top:15px; background:none; border:none; color:gray; cursor:pointer;">Close</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="#buy" style="color:gray;">🛒 Buy</a>
        <a href="#sell" style="color:gray;">➕ Sell</a>
        <a href="javascript:void(0)" onclick="openAuth()" style="color:gray;">👤 Profile</a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDyC4uyc10cXAFOESh4DSUSPXJN4EgVy_I",
            authDomain: "obasty-market.firebaseapp.com",
            projectId: "obasty-market",
            appId: "1:753490577388:web:8b2dac8f4082d89ee662c9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const colRef = collection(db, "listings");

        // --- FIXED WHATSAPP SHARE ---
        document.getElementById('shareBtnMain').onclick = () => {
            const text = encodeURIComponent("Check out the latest deals in Koforidua on NanaObasty Marketplace! 🛒🚀\n\nVisit here: " + window.location.href);
            window.open(`https://wa.me/?text=${text}`, '_blank');
        };

        // --- DELETE FUNCTION ---
        window.deleteItem = async (id) => {
            if(confirm("Mark as sold?")) await deleteDoc(doc(db, "listings", id));
        };

        // --- IMGBB UPLOAD ---
        async function uploadImg(file) {
            const fd = new FormData(); fd.append("image", file);
            const res = await fetch("https://api.imgbb.com/1/upload?key=f6f1d931d2c5da11833752754cf2dfcd", { method: "POST", body: fd });
            const d = await res.json(); return d.data.url;
        }

        // --- SUBMIT ---
        document.getElementById('sellForm').onsubmit = async (e) => {
            e.preventDefault();
            const user = JSON.parse(localStorage.getItem('nana_user'));
            if(!user) return openAuth();

            const btn = document.getElementById('publishBtn');
            btn.innerText = "Uploading..."; btn.disabled = true;

            try {
                const img = await uploadImg(document.getElementById('itemImage').files[0]);
                await addDoc(colRef, {
                    name: document.getElementById('itemName').value,
                    price: document.getElementById('itemPrice').value,
                    desc: document.getElementById('itemDesc').value,
                    image: img,
                    seller: user.name,
                    createdAt: new Date()
                });
                alert("Listed successfully!");
                location.reload();
            } catch(e) { alert("Error uploading"); }
        };

        // --- RENDER ---
        let masterList = [];
        onSnapshot(query(colRef, orderBy("createdAt", "desc")), (snap) => {
            masterList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            render(masterList);
        });

        function render(items) {
            const grid = document.getElementById('publicListingGrid');
            const user = JSON.parse(localStorage.getItem('nana_user'));
            grid.innerHTML = '';
            items.forEach(item => {
                const isOwner = user && (user.name === item.seller || user.name === "Admin");
                grid.innerHTML += `
                    <div class="product-card">
                        <div class="product-img" style="background-image:url('${item.image}')"></div>
                        <div class="product-info">
                            <div style="display:flex; justify-content:space-between;">
                                <strong>${item.name}</strong>
                                ${isOwner ? `<button onclick="deleteItem('${item.id}')">🗑️</button>` : ''}
                            </div>
                            <p style="color:green; font-weight:bold;">₵ ${item.price}</p>
                            <p style="font-size:0.7rem; color:gray;">Seller: ${item.seller}</p>
                            <a href="https://wa.me/233539547368?text=Hi, I want to buy the ${item.name}" class="btn btn-wa" style="display:block; text-align:center;">Chat Seller</a>
                        </div>
                    </div>`;
            });
        }

        document.getElementById('searchInput').oninput = (e) => {
            const val = e.target.value.toLowerCase();
            render(masterList.filter(i => i.name.toLowerCase().includes(val)));
        };
    </script>

    <script>
        function openAuth() { document.getElementById('authModal').classList.add('active'); }
        function closeAuth() { document.getElementById('authModal').classList.remove('active'); }
        document.getElementById('registerForm').onsubmit = (e) => {
            e.preventDefault();
            localStorage.setItem('nana_user', JSON.stringify({ name: document.getElementById('rName').value }));
            location.reload();
        };
        function logout() { localStorage.removeItem('nana_user'); location.reload(); }
        window.onload = () => {
            const u = JSON.parse(localStorage.getItem('nana_user'));
            if(u) {
                document.getElementById('authFields').style.display = 'none';
                document.getElementById('logoutSection').style.display = 'block';
                document.getElementById('userWelcome').innerText = "Hi, " + u.name;
                document.querySelector('.login-trigger').innerText = u.name;
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanaObasty | Premium Marketplace</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0066FF; --primary-soft: #eef5ff; --accent: #00D094;
            --bg: #F8FAFC; --card: #FFFFFF; --text-main: #0F172A;
            --text-muted: #64748B; --border: #E2E8F0; --shadow: 0 12px 24px -6px rgba(0, 0, 0, 0.05);
        }
        [data-theme="dark"] {
            --bg: #020617; --card: #0F172A; --text-main: #F1F5F9;
            --text-muted: #94A3B8; --border: #1E293B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text-main); transition: 0.3s; padding-bottom: 80px; }

        /* --- NAVIGATION --- */
        nav.top-nav {
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px);
            padding: 0.8rem 5%; display: flex; justify-content: space-between;
            align-items: center; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--border);
        }
        .logo { font-weight: 800; font-size: 1.4rem; color: var(--primary); cursor: pointer; }
        .nav-actions { display: flex; align-items: center; gap: 12px; }

        /* --- PROFILE DASHBOARD (The "Pro" Feature) --- */
        #profileSection { display: none; padding: 20px 5%; max-width: 900px; margin: 0 auto; animation: fadeIn 0.4s ease; }
        .profile-header { 
            background: var(--card); padding: 30px; border-radius: 24px; 
            border: 1px solid var(--border); display: flex; align-items: center; gap: 20px; margin-bottom: 25px;
        }
        .profile-avatar-big { 
            width: 80px; height: 80px; border-radius: 24px; background: var(--primary); 
            color: white; font-size: 2rem; font-weight: 800; display: flex; align-items: center; justify-content: center;
        }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 30px; }
        .stat-card { 
            background: var(--card); padding: 20px; border-radius: 20px; 
            border: 1px solid var(--border); text-align: center;
        }
        .stat-card span { display: block; font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }
        .stat-card b { font-size: 1.4rem; color: var(--primary); }

        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .tab-link { 
            padding: 8px 16px; cursor: pointer; font-weight: 600; color: var(--text-muted); 
            border-radius: 10px; transition: 0.2s; 
        }
        .tab-link.active { color: var(--primary); background: var(--primary-soft); }

        /* --- INVENTORY LISTING --- */
        .inventory-item {
            background: var(--card); padding: 15px; border-radius: 16px; border: 1px solid var(--border);
            display: flex; align-items: center; gap: 15px; margin-bottom: 12px;
        }
        .inventory-item img { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; }
        .inventory-info { flex: 1; }
        .inventory-actions { display: flex; gap: 8px; }

        /* --- PRODUCT CARDS --- */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .product-card { 
            background: var(--card); border-radius: 20px; border: 1px solid var(--border); 
            overflow: hidden; transition: 0.3s; cursor: pointer; 
        }
        .product-card:hover { transform: translateY(-5px); box-shadow: var(--shadow); }
        .card-img { height: 160px; background-size: cover; background-position: center; }
        .card-body { padding: 15px; }

        /* --- BUTTONS & MODALS --- */
        .btn { 
            background: var(--primary); color: white; border: none; padding: 12px 24px; 
            border-radius: 14px; font-weight: 700; cursor: pointer; transition: 0.2s;
        }
        .btn-sm { padding: 6px 12px; font-size: 0.8rem; border-radius: 8px; }
        .btn-danger { background: #ff4757; }
        .modal-overlay { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); 
            display: none; align-items: center; justify-content: center; z-index: 2000; 
        }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--card); padding: 30px; border-radius: 24px; width: 90%; max-width: 400px; }

        /* --- BOTTOM NAV --- */
        .bottom-nav { 
            position: fixed; bottom: 0; width: 100%; background: var(--card); 
            display: flex; justify-content: space-around; padding: 15px; border-top: 1px solid var(--border);
        }
        .nav-link { text-decoration: none; color: var(--text-muted); font-size: 0.75rem; text-align: center; font-weight: 700; }
        .nav-link.active { color: var(--primary); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <nav class="top-nav">
        <div class="logo" onclick="showView('buy')">Nana<span>Obasty</span></div>
        <div class="nav-actions">
            <button onclick="toggleTheme()" class="btn" style="background:var(--primary-soft); color:var(--primary); padding:8px 12px;">🌓</button>
        </div>
    </nav>

    <div id="buySection" style="padding: 20px 5%;">
        <div style="margin-bottom: 25px;">
            <input type="text" id="mainSearch" placeholder="Search for items..." style="width:100%; padding:15px; border-radius:15px; border:1px solid var(--border); outline:none;">
        </div>
        <div class="product-grid" id="productGrid"></div>
    </div>

    <div id="sellSection" style="display:none; padding: 20px 5%; max-width: 600px; margin: 0 auto;">
        <div style="background:var(--card); padding:30px; border-radius:24px; border:1px solid var(--border);">
            <h2 style="margin-bottom:20px;">Create New Listing</h2>
            <form id="listingForm">
                <input type="text" id="pName" placeholder="Product Name" required style="margin-bottom:15px; display:block;">
                <input type="number" id="pPrice" placeholder="Price (GH₵)" required style="margin-bottom:15px; display:block;">
                <select id="pCategory" style="margin-bottom:15px; display:block;">
                    <option>Electronics</option><option>Vehicles</option><option>Property</option><option>Fashion</option>
                </select>
                <input type="file" id="pImage" accept="image/*" required style="margin-bottom:20px; display:block;">
                <button type="submit" class="btn" style="width:100%;">Post Ad</button>
            </form>
        </div>
    </div>

    <div id="profileSection">
        <div class="profile-header">
            <div class="profile-avatar-big" id="profInitial">U</div>
            <div>
                <h2 id="profName">Business User</h2>
                <p style="color:var(--text-muted); font-size:0.9rem;" id="profEmail">user@example.com</p>
                <button onclick="signOutUser()" style="border:none; background:none; color:#ff4757; font-weight:700; cursor:pointer; font-size:0.8rem; margin-top:5px;">Sign Out</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><b>12</b><span>Active Ads</span></div>
            <div class="stat-card"><b>4.8k</b><span>Total Views</span></div>
            <div class="stat-card"><b>5.0</b><span>Rating</span></div>
        </div>

        <div class="tab-menu">
            <div class="tab-link active">My Inventory</div>
            <div class="tab-link">Settings</div>
        </div>

        <div id="myItemsList">
            </div>
    </div>

    <div id="authModal" class="modal-overlay">
        <div class="modal-content">
            <h2 style="margin-bottom:20px;">Welcome</h2>
            <input type="email" id="email" placeholder="Email" style="margin-bottom:12px; display:block;">
            <input type="password" id="pass" placeholder="Password" style="margin-bottom:20px; display:block;">
            <button onclick="login()" class="btn" style="width:100%;">Login / Sign Up</button>
            <button onclick="closeAuth()" style="width:100%; margin-top:10px; background:none; border:none; color:var(--text-muted); cursor:pointer;">Cancel</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-link active" onclick="showView('buy')">🏠<br>Explore</div>
        <div class="nav-link" onclick="showView('sell')">➕<br>Sell</div>
        <div class="nav-link" onclick="showView('profile')">👤<br>Account</div>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, where, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDyC4uyc10cXAFOESh4DSUSPXJN4EgVy_I", authDomain: "obasty-market.firebaseapp.com", projectId: "obasty-market", appId: "1:753490577388:web:8b2dac8f4082d89ee662c9" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        onAuthStateChanged(auth, user => {
            currentUser = user;
            if(user) {
                document.getElementById('profEmail').innerText = user.email;
                document.getElementById('profInitial').innerText = user.email[0].toUpperCase();
                loadUserInventory(user.uid);
            }
        });

        window.showView = (view) => {
            if(view === 'profile' && !currentUser) return openAuth();
            
            document.getElementById('buySection').style.display = view === 'buy' ? 'block' : 'none';
            document.getElementById('sellSection').style.display = view === 'sell' ? 'block' : 'none';
            document.getElementById('profileSection').style.display = view === 'profile' ? 'block' : 'none';
            
            document.querySelectorAll('.nav-link').forEach((l, i) => {
                l.classList.toggle('active', (view === 'buy' && i===0) || (view === 'sell' && i===1) || (view === 'profile' && i===2));
            });
        };

        window.openAuth = () => document.getElementById('authModal').classList.add('active');
        window.closeAuth = () => document.getElementById('authModal').classList.remove('active');

        window.login = async () => {
            const e = email.value; const p = pass.value;
            try {
                await signInWithEmailAndPassword(auth, e, p);
            } catch {
                await createUserWithEmailAndPassword(auth, e, p);
            }
            closeAuth();
        };

        window.signOutUser = () => signOut(auth).then(() => location.reload());

        // --- RENDER LISTINGS ---
        onSnapshot(query(collection(db, "listings"), orderBy("createdAt", "desc")), (snap) => {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = snap.docs.map(d => {
                const i = d.data();
                return `<div class="product-card">
                    <div class="card-img" style="background-image:url('${i.image}')"></div>
                    <div class="card-body">
                        <b style="display:block; margin-bottom:5px;">${i.name}</b>
                        <span style="color:var(--primary); font-weight:800;">GH₵ ${i.price}</span>
                    </div>
                </div>`;
            }).join('');
        });

        async function loadUserInventory(uid) {
            const q = query(collection(db, "listings"), where("sellerId", "==", uid));
            onSnapshot(q, snap => {
                const container = document.getElementById('myItemsList');
                container.innerHTML = snap.docs.map(d => {
                    const i = d.data();
                    return `<div class="inventory-item">
                        <img src="${i.image}">
                        <div class="inventory-info">
                            <b>${i.name}</b><br>
                            <small>GH₵ ${i.price}</small>
                        </div>
                        <div class="inventory-actions">
                            <button class="btn btn-sm btn-danger" onclick="deleteItem('${d.id}')">Delete</button>
                        </div>
                    </div>`;
                }).join('');
            });
        }

        window.deleteItem = async (id) => { if(confirm("Delete this ad?")) await deleteDoc(doc(db, "listings", id)); };

        document.getElementById('listingForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button'); btn.disabled = true; btn.innerText = "Uploading...";
            
            const file = document.getElementById('pImage').files[0];
            const fd = new FormData(); fd.append("image", file);
            const res = await fetch(`https://api.imgbb.com/1/upload?key=f6f1d931d2c5da11833752754cf2dfcd`, { method: "POST", body: fd });
            const img = await res.json();

            await addDoc(collection(db, "listings"), {
                name: pName.value, price: pPrice.value, category: pCategory.value,
                image: img.data.url, sellerId: currentUser.uid, createdAt: new Date()
            });
            showView('profile');
        };

        window.toggleTheme = () => {
            const theme = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', theme);
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanaObasty Marketplace | Koforidua</title>
    <style>
        /* --- GLOBAL STYLES --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { line-height: 1.6; color: #333; background-color: #f4f7f6; scroll-behavior: smooth; }
        a { text-decoration: none; }

        /* --- NAVIGATION --- */
        nav.top-nav { background: #1a2a3a; color: #fff; padding: 1rem 10%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 1.4rem; font-weight: bold; color: #4db8ff; letter-spacing: 1px; }
        .nav-links { list-style: none; display: flex; align-items: center; }
        .nav-links li { margin-left: 20px; }
        .nav-links a { color: #fff; font-size: 0.9rem; transition: 0.3s; cursor: pointer; }

        /* --- HERO --- */
        header { 
            background: linear-gradient(rgba(26, 42, 58, 0.75), rgba(26, 42, 58, 0.75)), url('photo_10_2026-02-26_13-58-16.jpg');
            background-size: cover; background-position: center; height: 35vh; color: #fff; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 20px; 
        }

        /* --- FILTER SECTION --- */
        .filter-container { padding: 20px 10%; background: #fff; border-bottom: 1px solid #eee; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; }
        .search-bar { flex: 2; min-width: 200px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        .price-filter { flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 5px; font-size: 0.85rem; }
        .cat-filter select { padding: 10px; border-radius: 8px; border: 1px solid #ddd; min-width: 140px; }

        /* --- MARKETPLACE --- */
        .marketplace { padding: 40px 10%; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; }
        .product-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); position: relative; }
        .product-img { height: 180px; background-size: cover; background-position: center; background-color: #eee; }
        .view-badge { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: #fff; padding: 3px 8px; border-radius: 12px; font-size: 0.7rem; }
        .product-info { padding: 15px; }

        /* --- SELL SECTION & LOCK --- */
        #sell { padding: 60px 10%; background: #fff; text-align: center; }
        .sell-lock-msg { padding: 40px; border: 2px dashed #ddd; border-radius: 15px; background: #fafafa; }
        .sell-form { display: none; max-width: 500px; margin: 0 auto; flex-direction: column; gap: 12px; text-align: left; }
        .sell-form.active { display: flex; }
        .sell-form input, .sell-form select, .sell-form textarea { padding: 12px; border: 1px solid #ddd; border-radius: 8px; width: 100%; }

        /* --- UI ELEMENTS --- */
        .btn { background: #4db8ff; color: #fff; padding: 10px 20px; border-radius: 5px; font-weight: bold; border: none; cursor: pointer; display: inline-block; text-align: center; }
        .btn-wa { background: #25D366; width: 100%; margin-top: 10px; border-radius: 8px; }
        
        /* --- MODAL --- */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 3000; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: #fff; padding: 30px; border-radius: 15px; max-width: 400px; width: 90%; text-align: center; }

        .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; border-top: 1px solid #eee; z-index: 2000; justify-content: space-around; padding: 10px 0; }
        @media (max-width: 768px) { .bottom-nav { display: flex; } .nav-links { display: none; } body { padding-bottom: 70px; } }
    </style>
</head>
<body>

    <nav class="top-nav">
        <div class="logo">NANAOBASTY</div>
        <ul class="nav-links">
            <li><a href="#buy">Explore</a></li>
            <li><a href="#sell">Sell</a></li>
            <li><a href="javascript:void(0)" onclick="openAuth()" class="login-trigger">Login</a></li>
        </ul>
    </nav>

    <header>
        <h1>NanaObasty Marketplace</h1>
        <p>Real-time local deals in Koforidua.</p>
        <button id="shareBtnMain" class="btn" style="background: #25D366; margin-top: 15px;">📲 Share Market</button>
    </header>

    <div class="filter-container">
        <input type="text" id="searchInput" class="search-bar" placeholder="Search for items...">
        <div class="cat-filter">
            <select id="catSelect">
                <option value="All">All Categories</option>
                <option value="Electronics">Electronics</option>
                <option value="Fashion">Fashion</option>
                <option value="Home">Home</option>
            </select>
        </div>
        <div class="price-filter">
            <label>Max: <span id="priceLabel">₵5000</span></label>
            <input type="range" id="priceRange" min="0" max="5000" step="100" value="5000">
        </div>
    </div>

    <section class="marketplace" id="buy">
        <div id="publicListingGrid" class="product-grid"></div>
    </section>

    <section id="sell">
        <h2 style="margin-bottom: 20px;">Post an Item</h2>
        
        <div id="loginReminder" class="sell-lock-msg">
            <p style="margin-bottom: 15px; color: #666;">You must be logged in to post an item for sale.</p>
            <button onclick="openAuth()" class="btn">Login to Post</button>
        </div>

        <form class="sell-form" id="sellForm">
            <input type="text" id="itemName" placeholder="Item Name" required>
            <input type="number" id="itemPrice" placeholder="Price (GHS)" required>
            <select id="itemCat"><option>Electronics</option><option>Fashion</option><option>Home</option></select>
            <input type="file" id="itemImage" accept="image/*" required>
            <textarea id="itemDesc" placeholder="Description + Your WhatsApp Number" rows="3" required></textarea>
            <button type="submit" id="publishBtn" class="btn">Publish Listing</button>
        </form>
    </section>

    <div id="authModal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="authTitle">Welcome</h3>
            <div id="authFields">
                <form id="registerForm" style="display:flex; flex-direction:column; gap:10px; margin-top:15px;">
                    <input type="text" id="rName" placeholder="Enter Your Name" required style="padding:12px; border:1px solid #ddd; border-radius:8px;">
                    <button type="submit" class="btn">Login Now</button>
                </form>
            </div>
            <div id="logoutSection" style="display:none;">
                <p id="userWelcome" style="font-weight: bold; font-size: 1.1rem;"></p>
                <button onclick="logout()" class="btn" style="background:red; margin-top:15px; width: 100%;">Logout</button>
            </div>
            <button onclick="closeAuth()" style="margin-top:20px; background:none; border:none; color:gray; cursor:pointer;">Close</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="#buy" style="color:gray;">🛒 Buy</a>
        <a href="#sell" style="color:gray;">➕ Sell</a>
        <a href="javascript:void(0)" onclick="openAuth()" style="color:gray;">👤 Account</a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDyC4uyc10cXAFOESh4DSUSPXJN4EgVy_I",
            authDomain: "obasty-market.firebaseapp.com",
            projectId: "obasty-market",
            appId: "1:753490577388:web:8b2dac8f4082d89ee662c9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const colRef = collection(db, "listings");

        // --- TRACK VIEW ---
        window.trackView = async (id, name) => {
            await updateDoc(doc(db, "listings", id), { views: increment(1) });
            const waUrl = `https://api.whatsapp.com/send?phone=233539547368&text=${encodeURIComponent("Hi, I saw " + name + " on NanaObasty!")}`;
            window.open(waUrl, '_blank');
        };

        // --- SHARE ---
        document.getElementById('shareBtnMain').onclick = async () => {
            if (navigator.share) { await navigator.share({ title: 'NanaObasty', text: 'Check out Koforidua deals!', url: window.location.href }); }
            else { window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(window.location.href)}`, '_blank'); }
        };

        window.deleteItem = async (id) => { if(confirm("Delete item?")) await deleteDoc(doc(db, "listings", id)); };

        async function uploadImg(file) {
            const fd = new FormData(); fd.append("image", file);
            const res = await fetch("https://api.imgbb.com/1/upload?key=f6f1d931d2c5da11833752754cf2dfcd", { method: "POST", body: fd });
            const d = await res.json(); return d.data.url;
        }

        // --- SECURE SUBMIT ---
        document.getElementById('sellForm').onsubmit = async (e) => {
            e.preventDefault();
            const user = JSON.parse(localStorage.getItem('nana_user'));
            if(!user) { alert("Please login first!"); return openAuth(); }

            const btn = document.getElementById('publishBtn');
            btn.innerText = "Publishing..."; btn.disabled = true;

            try {
                const img = await uploadImg(document.getElementById('itemImage').files[0]);
                await addDoc(colRef, {
                    name: document.getElementById('itemName').value,
                    price: parseFloat(document.getElementById('itemPrice').value),
                    category: document.getElementById('itemCat').value,
                    desc: document.getElementById('itemDesc').value,
                    image: img,
                    seller: user.name,
                    views: 0,
                    createdAt: new Date()
                });
                location.reload();
            } catch(e) { alert("Error uploading"); btn.disabled = false; }
        };

        let masterList = [];
        onSnapshot(query(colRef, orderBy("createdAt", "desc")), (snap) => {
            masterList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            applyFilters();
        });

        function applyFilters() {
            const s = document.getElementById('searchInput').value.toLowerCase();
            const p = parseFloat(document.getElementById('priceRange').value);
            const c = document.getElementById('catSelect').value;
            const filtered = masterList.filter(i => i.name.toLowerCase().includes(s) && i.price <= p && (c === "All" || i.category === c));
            render(filtered);
        }

        function render(items) {
            const grid = document.getElementById('publicListingGrid');
            const user = JSON.parse(localStorage.getItem('nana_user'));
            grid.innerHTML = items.length ? '' : '<p style="grid-column:1/-1;text-align:center;">No items found.</p>';
            items.forEach(item => {
                const isOwner = user && (user.name === item.seller || user.name === "Admin");
                grid.innerHTML += `
                    <div class="product-card">
                        <div class="view-badge">🔥 ${item.views || 0}</div>
                        <div class="product-img" style="background-image:url('${item.image}')"></div>
                        <div class="product-info">
                            <div style="display:flex; justify-content:space-between;">
                                <strong>${item.name}</strong>
                                ${isOwner ? `<button onclick="deleteItem('${item.id}')" style="background:none;border:none;cursor:pointer;">🗑️</button>` : ''}
                            </div>
                            <p style="color:#2ecc71; font-weight:bold; font-size:1.1rem; margin:5px 0;">₵ ${item.price}</p>
                            <p style="font-size:0.7rem; color:gray; margin-bottom: 8px;">Seller: ${item.seller}</p>
                            <button onclick="trackView('${item.id}', '${item.name}')" class="btn btn-wa">Contact Seller</button>
                        </div>
                    </div>`;
            });
        }

        document.getElementById('searchInput').addEventListener('input', applyFilters);
        document.getElementById('catSelect').addEventListener('change', applyFilters);
        document.getElementById('priceRange').addEventListener('input', (e) => {
            document.getElementById('priceLabel').innerText = `₵${e.target.value}`;
            applyFilters();
        });
    </script>

    <script>
        function openAuth() { document.getElementById('authModal').classList.add('active'); }
        function closeAuth() { document.getElementById('authModal').classList.remove('active'); }
        
        document.getElementById('registerForm').onsubmit = (e) => {
            e.preventDefault();
            localStorage.setItem('nana_user', JSON.stringify({ name: document.getElementById('rName').value }));
            location.reload();
        };

        function logout() { localStorage.removeItem('nana_user'); location.reload(); }

        window.onload = () => {
            const u = JSON.parse(localStorage.getItem('nana_user'));
            if(u) {
                // UI changes for Logged in user
                document.getElementById('logoutSection').style.display = 'block';
                document.getElementById('authFields').style.display = 'none';
                document.getElementById('userWelcome').innerText = "Logged in as: " + u.name;
                document.querySelector('.login-trigger').innerText = u.name.split(' ')[0];
                
                // SHOW the sell form and HIDE the reminder
                document.getElementById('sellForm').classList.add('active');
                document.getElementById('loginReminder').style.display = 'none';
            }
        };
    </script>
</body>
</html>

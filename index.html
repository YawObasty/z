<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanaObasty | The Gold Standard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366F1; --secondary: #EC4899; --accent: #00D094;
            --bg: #030712; --glass: rgba(17, 24, 39, 0.75);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: #fff; overflow-x: hidden; }

        /* --- Elite Background: Mouse Spotlight --- */
        #spotlight {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(99, 102, 241, 0.12) 0%, transparent 40%);
            z-index: -1; pointer-events: none;
        }

        /* --- SVG Icon Styling --- */
        .icon { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; vertical-align: middle; }

        /* --- Floating Navigation --- */
        nav {
            position: sticky; top: 20px; margin: 0 5%;
            background: var(--glass); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 20px;
            padding: 12px 25px; display: flex; justify-content: space-between;
            align-items: center; z-index: 1000;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .logo { font-size: 1.4rem; font-weight: 800; letter-spacing: -1px; display: flex; align-items: center; gap: 10px; }
        .logo span { color: var(--primary); }

        .nav-right { display: flex; align-items: center; gap: 20px; }

        /* --- Login Icon Button --- */
        .login-trigger {
            background: rgba(99, 102, 241, 0.15); border: 1px solid var(--primary);
            color: var(--primary); padding: 8px 16px; border-radius: 12px;
            display: flex; align-items: center; gap: 8px; cursor: pointer;
            transition: 0.3s; font-weight: 600;
        }
        .login-trigger:hover { background: var(--primary); color: white; box-shadow: 0 0 20px rgba(99, 102, 241, 0.4); }

        /* --- Main Hero Search --- */
        .search-area { padding: 60px 5% 20px; max-width: 800px; margin: 0 auto; text-align: center; }
        .search-box {
            display: flex; align-items: center; background: var(--glass);
            border: 1px solid var(--border); border-radius: 18px; padding: 15px 25px;
            gap: 15px; margin-top: 30px; transition: 0.3s;
        }
        .search-box:focus-within { border-color: var(--primary); box-shadow: 0 0 30px rgba(99, 102, 241, 0.2); }
        .search-box input { background: transparent; border: none; color: white; width: 100%; outline: none; font-size: 1rem; }

        /* --- Grid Layout --- */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; padding: 40px 5%; }

        .card {
            background: var(--glass); border-radius: 30px; border: 1px solid var(--border);
            padding: 16px; position: relative; overflow: hidden;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .card:hover { transform: translateY(-12px); border-color: rgba(99, 102, 241, 0.4); }

        .img-box { width: 100%; height: 200px; border-radius: 20px; overflow: hidden; margin-bottom: 18px; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }

        /* --- Card Buttons --- */
        .btn-action {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px; border-radius: 14px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s;
        }
        .btn-main { background: var(--primary); color: white; flex: 2; }
        .btn-sec { background: rgba(255,255,255,0.05); color: white; border: 1px solid var(--border); flex: 1; }
        .btn-action:hover { opacity: 0.9; transform: scale(0.96); }

        /* --- Mobile Bottom Nav --- */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 70px;
            background: var(--glass); backdrop-filter: blur(25px);
            border-top: 1px solid var(--border); display: flex; justify-content: space-around;
            align-items: center; padding-bottom: 5px; z-index: 2000;
        }
        .nav-item { color: rgba(255,255,255,0.5); text-align: center; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: var(--primary); }
        .nav-item span { display: block; font-size: 0.65rem; margin-top: 4px; font-weight: 700; }

    </style>
</head>

            <span>Inbox</span>
        </div>
    </div>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanaObasty | Obsidian Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a; /* Deep Midnight */
            --card-bg: #1e293b; /* Slate Glass */
            --primary: #10b981; /* Emerald Green */
            --secondary: #6366f1; /* Royal Indigo */
            --text-main: #f1f5f9; /* Off-White/Silver text */
            --text-muted: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background-color: var(--bg); 
            color: var(--text-main); 
            padding-bottom: 100px;
            min-height: 100vh;
            background-image: radial-gradient(circle at 0% 0%, rgba(16, 185, 129, 0.05) 0%, transparent 50%),
                              radial-gradient(circle at 100% 100%, rgba(99, 102, 241, 0.05) 0%, transparent 50%);
        }

        /* --- LUXURY HEADER --- */
        header {
            position: sticky; top: 0; z-index: 1000;
            padding: 20px 6%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 24px; font-weight: 800; color: #fff; letter-spacing: -1px; }
        .logo span { color: var(--primary); }

        .profile-trigger {
            width: 42px; height: 42px; background: var(--card-bg); border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--glass-border); cursor: pointer;
        }

        /* --- GLOWING HERO --- */
        .hero { padding: 40px 6% 20px; }
        .hero h1 { font-size: 34px; font-weight: 800; line-height: 1.1; margin-bottom: 25px; color: #fff; }
        
        .search-box {
            background: var(--card-bg); border-radius: 16px; padding: 6px 6px 6px 20px;
            display: flex; align-items: center; border: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .search-box input { background: transparent; border: none; outline: none; width: 100%; font-size: 16px; color: #fff; padding-right: 10px; }
        .search-box input::placeholder { color: var(--text-muted); }
        .search-btn { background: var(--primary); color: #fff; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; }

        /* --- VIEW TRANSITIONS --- */
        .view { display: none; animation: slideIn 0.5s ease-out; }
        .view.active { display: block; }
        @keyframes slideIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        /* --- OBSIDIAN CARDS --- */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 20px; padding: 20px 6%; }
        
        .card { 
            background: var(--card-bg); border-radius: 24px; padding: 12px; 
            border: 1px solid var(--glass-border); transition: 0.3s; cursor: pointer;
            position: relative; overflow: hidden;
        }
        .card:hover { transform: translateY(-8px); border-color: var(--primary); box-shadow: 0 15px 30px rgba(16, 185, 129, 0.1); }
        
        .card-img { width: 100%; height: 180px; object-fit: cover; border-radius: 18px; margin-bottom: 12px; }
        
        .card-price { font-size: 18px; font-weight: 800; color: var(--primary); display: block; }
        .card-title { font-size: 14px; font-weight: 500; color: var(--text-muted); margin-top: 4px; }

        /* --- DARK FORMS --- */
        .form-container { max-width: 450px; margin: 20px auto; background: var(--card-bg); padding: 30px; border-radius: 28px; border: 1px solid var(--glass-border); }
        .form-container h2 { margin-bottom: 20px; font-weight: 800; }
        input, select, textarea { 
            width: 100%; padding: 16px; border-radius: 14px; border: 1px solid var(--glass-border); 
            background: rgba(15, 23, 42, 0.5); font-size: 15px; outline: none; color: #fff; margin-bottom: 15px;
        }
        input:focus { border-color: var(--secondary); background: rgba(15, 23, 42, 0.8); }

        /* --- FIXED DOCK NAV --- */
        .dock {
            position: fixed; bottom: 25px; left: 6%; right: 6%; height: 70px;
            background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(20px);
            border-radius: 20px; display: flex; justify-content: space-around; align-items: center;
            border: 1px solid var(--glass-border); box-shadow: 0 20px 40px rgba(0,0,0,0.4); z-index: 2000;
        }
        .dock-item { color: var(--text-muted); text-align: center; font-size: 10px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .dock-item.active { color: var(--primary); }
        .dock-item svg { display: block; margin: 0 auto 4px; width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2.5; }

        /* --- BUTTONS --- */
        .btn-action { 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            color: white; border: none; padding: 18px; border-radius: 16px; 
            width: 100%; font-weight: 800; cursor: pointer; transition: 0.2s; font-size: 16px;
        }
        .btn-action:active { transform: scale(0.97); }

    </style>
</head>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanaObasty | Ghana's Premium Marketplace</title>
    <style>
        :root { 
            --primary: #007bff; --primary-dark: #0056b3;
            --bg: #f8fafc; --card-bg: #ffffff; --text: #1e293b; 
            --border: #e2e8f0; --accent: #4db8ff; --heart: #ff4757; 
            --success: #10b981; --glass: rgba(255, 255, 255, 0.8);
        }
        [data-theme="dark"] { 
            --bg: #0f172a; --card-bg: #1e293b; --text: #f1f5f9; 
            --border: #334155; --glass: rgba(15, 23, 42, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; transition: all 0.25s ease; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; }

        /* --- MODERN GLASS NAVIGATION --- */
        nav.top-nav { 
            background: var(--glass); backdrop-filter: blur(12px); 
            padding: 0.8rem 10%; display: flex; justify-content: space-between; 
            align-items: center; position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid var(--border);
        }
        .logo { font-size: 1.5rem; font-weight: 900; color: var(--primary); letter-spacing: -1px; text-transform: uppercase; }

        /* --- CATEGORY CHIPS --- */
        .categories { 
            display: flex; gap: 10px; overflow-x: auto; padding: 15px 10%; 
            scrollbar-width: none; background: var(--card-bg);
        }
        .chip { 
            padding: 8px 18px; border-radius: 20px; background: var(--bg); 
            border: 1px solid var(--border); cursor: pointer; white-space: nowrap; font-size: 0.85rem; font-weight: 500;
        }
        .chip.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* --- HERO SEARCH --- */
        .hero-search { padding: 20px 10%; background: var(--card-bg); border-bottom: 1px solid var(--border); }
        .search-box { 
            display: flex; background: var(--bg); border: 1px solid var(--border); 
            border-radius: 12px; padding: 5px 15px; align-items: center; 
        }
        .search-box input { 
            border: none; background: transparent; padding: 12px; width: 100%; 
            outline: none; color: var(--text); font-size: 1rem;
        }

        /* --- PRODUCT CARDS --- */
        .marketplace { padding: 20px 10%; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
        
        .card { 
            background: var(--card-bg); border-radius: 16px; overflow: hidden; 
            border: 1px solid var(--border); position: relative;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.1); }
        
        .card-img { height: 200px; background-size: cover; background-position: center; position: relative; }
        .badge-sold { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg);
            background: rgba(255, 71, 87, 0.9); color: white; padding: 5px 15px; 
            font-weight: 900; border: 2px solid white; z-index: 5; pointer-events: none;
        }
        
        .verified-tag { color: #3b82f6; font-size: 0.9rem; margin-left: 4px; }
        .card-body { padding: 15px; }
        .price { font-size: 1.25rem; font-weight: 800; color: var(--success); margin: 5px 0; }

        /* --- PRO SELL SECTION --- */
        .sell-banner { 
            margin: 40px 10%; background: linear-gradient(135deg, #007bff, #6610f2); 
            border-radius: 20px; padding: 40px; color: white; text-align: center;
        }
        .btn-white { 
            background: white; color: var(--primary); padding: 12px 30px; 
            border-radius: 10px; font-weight: 700; border: none; cursor: pointer; margin-top: 15px;
        }

        /* --- BOTTOM NAV --- */
        .bottom-nav { 
            position: fixed; bottom: 0; width: 100%; background: var(--glass); 
            backdrop-filter: blur(10px); display: flex; justify-content: space-around; 
            padding: 12px; border-top: 1px solid var(--border); z-index: 1000;
        }
        .nav-item { text-decoration: none; color: #64748b; font-size: 0.75rem; text-align: center; }
        .nav-item.active { color: var(--primary); font-weight: 700; }

        /* --- NEW: RATING & REVIEW SYSTEM STYLES --- */
        .star-rating { display: flex; gap: 5px; cursor: pointer; font-size: 1.5rem; margin: 10px 0; }
        .star-rating span { color: #ccc; }
        .star-rating span.active { color: #f1c40f; }
        .review-card { background: var(--bg); padding: 12px; border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--border); }
        .review-stars { color: #f1c40f; font-size: 0.8rem; }

        /* --- NEW: CHAT UI STYLES --- */
        #chatModal { display: none; position: fixed; bottom: 80px; right: 20px; width: 300px; background: var(--card-bg); border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 2000; flex-direction: column; border: 1px solid var(--border); }
        #messageList { height: 250px; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .msg-bubble { padding: 8px 12px; border-radius: 12px; font-size: 0.85rem; max-width: 80%; }

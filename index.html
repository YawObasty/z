<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanaObasty | Elegant Trade</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg-gradient: linear-gradient(135deg, #f5f7ff 0%, #fef0ff 100%);
            --glass: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
            --text: #1e1b4b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background: var(--bg-gradient); 
            background-attachment: fixed;
            color: var(--text); 
            padding-bottom: 100px;
            min-height: 100vh;
        }

        /* --- BEAUTIFUL HEADER --- */
        header {
            position: sticky; top: 0; z-index: 1000;
            padding: 20px 6%;
            background: var(--glass);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 24px; font-weight: 800; background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -1px; }

        /* --- HERO SEARCH --- */
        .hero { padding: 40px 6% 20px; }
        .hero h1 { font-size: 32px; font-weight: 800; line-height: 1.2; margin-bottom: 20px; }
        
        .search-pill {
            background: white; border-radius: 50px; padding: 8px 10px 8px 25px;
            display: flex; align-items: center; box-shadow: 0 15px 30px rgba(99, 102, 241, 0.1);
            border: 1px solid var(--glass-border);
        }
        .search-pill input { border: none; outline: none; width: 100%; font-size: 16px; font-weight: 600; color: var(--text); }
        .search-go { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 50px; font-weight: 700; cursor: pointer; }

        /* --- CARD DESIGN --- */
        .view { display: none; animation: fadeIn 0.6s cubic-bezier(0.23, 1, 0.32, 1); }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 20px; padding: 20px 6%; }
        
        .aura-card { 
            background: var(--glass); border-radius: 30px; padding: 12px; 
            border: 1px solid var(--glass-border); backdrop-filter: blur(5px);
            transition: all 0.4s ease; cursor: pointer;
        }
        .aura-card:hover { transform: translateY(-10px) scale(1.02); background: white; box-shadow: 0 25px 50px rgba(0,0,0,0.08); }
        .aura-card img { width: 100%; height: 180px; object-fit: cover; border-radius: 22px; margin-bottom: 12px; }
        .card-price { font-size: 18px; font-weight: 800; color: var(--primary); display: block; }
        .card-title { font-size: 14px; font-weight: 600; opacity: 0.7; margin-top: 4px; }

        /* --- SOFT FORMS --- */
        .form-box { max-width: 500px; margin: 20px auto; background: var(--glass); padding: 35px; border-radius: 40px; border: 1px solid var(--glass-border); box-shadow: 0 20px 40px rgba(0,0,0,0.05); }
        .input-group { margin-bottom: 20px; }
        input, select, textarea { 
            width: 100%; padding: 18px; border-radius: 20px; border: 1px solid var(--glass-border); 
            background: rgba(255,255,255,0.5); font-size: 15px; outline: none; transition: 0.3s;
        }
        input:focus { background: white; border-color: var(--primary); }

        /* --- FLOATING NAVIGATION --- */
        .floating-nav {
            position: fixed; bottom: 30px; left: 10%; right: 10%; height: 75px;
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px);
            border-radius: 100px; display: flex; justify-content: space-around; align-items: center;
            box-shadow: 0 20px 40px rgba(99, 102, 241, 0.15); border: 1px solid var(--glass-border); z-index: 2000;
        }
        .nav-link { color: #94a3b8; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; transition: 0.3s; }
        .nav-link.active { color: var(--primary); transform: translateY(-5px); }
        .nav-link svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 2.2; }

        /* --- GRADIENT BUTTONS --- */
        .btn-grad { 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            color: white; border: none; padding: 18px; border-radius: 22px; 
            width: 100%; font-weight: 800; cursor: pointer; transition: 0.3s; font-size: 16px;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.2);
        }
        .btn-grad:active { transform: scale(0.96); }

    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="switchView('home')">NanaObasty</div>
        <div onclick="switchView('auth')" style="background:white; padding:10px; border-radius:15px; cursor:pointer;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
    </header>

    <main id="view-home" class="view active">
        <div class="hero">
            <h1>Discover your next <br> favorite thing.</h1>
            <div class="search-pill">
                <input type="text" placeholder="I'm looking for...">
                <button class="search-go">Go</button>
            </div>
        </div>
        <div class="grid" id="mainGrid">
            </div>
    </main>

    <main id="view-sell" class="view">
        <div class="form-box">
            <h2 style="margin-bottom: 25px; font-weight: 800;">Create Listing</h2>
            <form id="postForm">
                <input type="text" id="p-title" placeholder="Item name" required style="margin-bottom: 15px;">
                <input type="number" id="p-price" placeholder="Price (GH₵)" required style="margin-bottom: 15px;">
                <input type="file" id="p-image" required style="margin-bottom: 15px;">
                <button type="submit" class="btn-grad" id="submitBtn">Publish Now</button>
            </form>
        </div>
    </main>

    <main id="view-auth" class="view">
        <div class="form-box" style="text-align: center;">
            <h2 style="margin-bottom: 10px;">Membership</h2>
            <p style="color: #64748b; margin-bottom: 30px;">Access Ghana's finest marketplace.</p>
            <input type="email" id="email" placeholder="Email" style="margin-bottom: 15px;">
            <input type="password" id="password" placeholder="Password" style="margin-bottom: 25px;">
            <button class="btn-grad" onclick="handleAuth()">Join / Sign In</button>
        </div>
    </main>

    <nav class="floating-nav">
        <div class="nav-link active" id="tab-home" onclick="switchView('home')">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        </div>
        <div class="nav-link" id="tab-sell" onclick="switchView('sell')">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        </div>
        <div class="nav-link" onclick="alert('Chat service opening soon')">
            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </div>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDyC4uyc10cXAFOESh4DSUSPXJN4EgVy_I", authDomain: "obasty-market.firebaseapp.com", projectId: "obasty-market", appId: "1:753490577388:web:8b2dac8f4082d89ee662c9" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let user = null;

        window.switchView = (id) => {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-' + id).classList.add('active');
            document.querySelectorAll('.nav-link').forEach(i => i.classList.remove('active'));
            const tab = document.getElementById('tab-' + id);
            if(tab) tab.classList.add('active');
            window.scrollTo({top: 0, behavior: 'smooth'});
        };

        window.handleAuth = async () => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            try { await signInWithEmailAndPassword(auth, e, p); }
            catch { await createUserWithEmailAndPassword(auth, e, p); }
            switchView('home');
        };

        onAuthStateChanged(auth, u => { user = u; });

        onSnapshot(query(collection(db, "listings"), orderBy("createdAt", "desc")), snap => {
            const grid = document.getElementById('mainGrid');
            grid.innerHTML = snap.docs.map(doc => {
                const data = doc.data();
                return `
                <div class="aura-card" onclick="window.location.href='tel:0240000000'">
                    <img src="${data.image}">
                    <span class="card-price">₵ ${data.price}</span>
                    <span class="card-title">${data.title}</span>
                </div>`;
            }).join('');
        });

        document.getElementById('postForm').onsubmit = async (e) => {
            e.preventDefault();
            if(!user) return switchView('auth');
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Polishing Listing..."; btn.disabled = true;

            try {
                const file = document.getElementById('p-image').files[0];
                const fd = new FormData(); fd.append("image", file);
                const res = await fetch(`https://api.imgbb.com/1/upload?key=f6f1d931d2c5da11833752754cf2dfcd`, { method: "POST", body: fd });
                const json = await res.json();

                await addDoc(collection(db, "listings"), {
                    title: document.getElementById('p-title').value,
                    price: document.getElementById('p-price').value,
                    image: json.data.url,
                    createdAt: new Date()
                });
                switchView('home');
            } catch (err) { alert("Try again."); }
            finally { btn.innerText = "Publish Now"; btn.disabled = false; }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NANA OBASTY | Live Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .product-card:hover img { transform: scale(1.05); }
        .hidden-form { display: none; }
        .cart-sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-[#F4F4F6] text-[#1A1A1A]">

    <div class="bg-orange-500 text-white text-[10px] tracking-[0.2em] py-2 text-center uppercase font-black">
        <span class="animate-pulse">🔥 FLASH SALES STARTING IN <span id="timer">00:00:00</span> 🔥</span>
    </div>

    <nav class="glass sticky top-0 z-50 border-b border-gray-200">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="#" class="text-xl font-black tracking-tighter flex items-center">
                NANA <span class="bg-orange-500 text-white ml-1 px-2 py-0.5 rounded">OBASTY</span>
            </a>
            
            <div class="flex-1 max-w-xl mx-8 hidden md:block relative">
                <input type="text" id="searchInput" onkeyup="window.searchProducts()" placeholder="Search products..." class="w-full bg-gray-100 border border-gray-300 rounded-lg px-10 py-2 text-sm outline-none focus:ring-2 ring-orange-500/20">
                <span class="material-symbols-outlined absolute left-3 top-2 text-gray-400">search</span>
            </div>

            <div class="flex items-center space-x-6">
                <button onclick="window.toggleModal()" class="flex items-center gap-1 hover:text-orange-500 transition font-bold text-xs uppercase">
                    <span class="material-symbols-outlined">person</span> <span id="user-display" class="hidden sm:inline">Account</span>
                </button>
                <div class="relative">
                    <button onclick="window.toggleCart()" class="flex items-center gap-1 hover:text-orange-500 transition font-bold text-xs uppercase">
                        <span class="material-symbols-outlined">shopping_cart</span> <span class="hidden sm:inline">Cart</span>
                    </button>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-orange-500 text-white text-[9px] w-4 h-4 flex items-center justify-center rounded-full font-bold">0</span>
                </div>
            </div>
        </div>
    </nav>

    <section class="bg-white py-6 border-b overflow-x-auto no-scrollbar">
        <div class="container mx-auto px-4 flex justify-between sm:justify-center gap-8 min-w-max">
            <button onclick="window.filterCat('all')" class="flex flex-col items-center gap-2 group">
                <div class="w-14 h-14 rounded-full bg-gray-100 flex items-center justify-center group-hover:bg-orange-100 transition"><span class="material-symbols-outlined text-orange-500">grid_view</span></div>
                <span class="text-[10px] font-bold uppercase tracking-tight">All</span>
            </button>
            <button onclick="window.filterCat('tech')" class="flex flex-col items-center gap-2 group">
                <div class="w-14 h-14 rounded-full bg-gray-100 flex items-center justify-center group-hover:bg-orange-100 transition"><span class="material-symbols-outlined text-blue-500">devices</span></div>
                <span class="text-[10px] font-bold uppercase tracking-tight">Phones</span>
            </button>
            <button onclick="window.filterCat('style')" class="flex flex-col items-center gap-2 group">
                <div class="w-14 h-14 rounded-full bg-gray-100 flex items-center justify-center group-hover:bg-orange-100 transition"><span class="material-symbols-outlined text-purple-500">checkroom</span></div>
                <span class="text-[10px] font-bold uppercase tracking-tight">Fashion</span>
            </button>
            <button onclick="window.checkAuthAndSell()" class="flex flex-col items-center gap-2 group">
                <div class="w-14 h-14 rounded-full bg-orange-500 flex items-center justify-center shadow-lg"><span class="material-symbols-outlined text-white">sell</span></div>
                <span class="text-[10px] font-bold uppercase tracking-tight text-orange-600">Sell Now</span>
            </button>
        </div>
    </section>

    <section class="container mx-auto px-4 mt-8 mb-20">
        <div class="bg-orange-600 rounded-t-lg p-4 flex justify-between items-center text-white">
            <h2 class="font-bold flex items-center gap-2 uppercase italic"><span class="material-symbols-outlined">bolt</span> Live Marketplace</h2>
        </div>
        <div id="product-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-3 bg-white p-4 rounded-b-lg shadow-sm">
            <p class="text-center col-span-full py-10 text-gray-400">Loading products from the cloud...</p>
        </div>
    </section>

    <div id="sell-modal" class="fixed inset-0 bg-black/60 z-[1000] flex items-center justify-center hidden">
        <div class="bg-white p-8 rounded-xl w-full max-w-md shadow-2xl relative mx-4">
            <button onclick="window.toggleSellModal()" class="absolute top-4 right-4 material-symbols-outlined">close</button>
            <h2 class="text-xl font-black mb-6 uppercase">Post Your Product</h2>
            <form id="sellForm" class="space-y-4">
                <input type="text" id="sellerProductName" placeholder="Product Title" class="w-full p-3 border rounded-lg" required>
                <input type="number" id="sellerProductPrice" placeholder="Price ($)" class="w-full p-3 border rounded-lg" required>
                <select id="sellerProductCategory" class="w-full p-3 border rounded-lg">
                    <option value="tech">Electronics</option>
                    <option value="style">Fashion</option>
                </select>
                <input type="url" id="sellerProductImage" placeholder="Image URL (e.g. Unsplash link)" class="w-full p-3 border rounded-lg" required>
                <button type="submit" class="w-full bg-orange-500 text-white py-4 rounded-lg font-bold uppercase">Post Live</button>
            </form>
        </div>
    </div>

    <div id="profile-modal" class="fixed inset-0 bg-black/60 z-[1000] flex items-center justify-center hidden">
        <div class="bg-white p-8 rounded-xl w-full max-w-md shadow-2xl relative mx-4 text-center">
            <button onclick="window.toggleModal()" class="absolute top-4 right-4 material-symbols-outlined">close</button>
            
            <div id="auth-selection">
                <h2 class="text-2xl font-black mb-6 uppercase">My Account</h2>
                <button onclick="window.showForm('login')" class="w-full bg-black text-white py-4 rounded-full font-bold uppercase mb-4">Login</button>
                <button onclick="window.showForm('signup')" class="w-full border-2 border-black py-4 rounded-full font-bold uppercase">Create Account</button>
            </div>

            <div id="login-form" class="hidden-form">
                <button onclick="window.showForm('selection')" class="text-xs font-bold text-orange-500 mb-4 block">← BACK</button>
                <form id="loginForm" class="space-y-4">
                    <input type="email" placeholder="Email" class="w-full p-3 border rounded-lg" required>
                    <input type="password" placeholder="Password" class="w-full p-3 border rounded-lg" required>
                    <button type="submit" class="w-full bg-orange-500 text-white py-4 rounded-lg font-bold uppercase">Sign In</button>
                </form>
            </div>

            <div id="signup-form" class="hidden-form">
                <button onclick="window.showForm('selection')" class="text-xs font-bold text-orange-500 mb-4 block">← BACK</button>
                <form id="signupForm" class="space-y-4">
                    <input type="email" placeholder="Email" class="w-full p-3 border rounded-lg" required>
                    <input type="password" placeholder="Password" class="w-full p-3 border rounded-lg" required>
                    <button type="submit" class="w-full bg-orange-500 text-white py-4 rounded-lg font-bold uppercase">Register</button>
                </form>
            </div>
        </div>
    </div>

    <div id="cart-overlay" class="fixed inset-0 bg-black/40 z-[100] hidden" onclick="window.toggleCart()"></div>
    <div id="cart-sidebar" class="fixed right-0 top-0 h-full w-full max-w-sm bg-white z-[101] cart-sidebar translate-x-full shadow-2xl flex flex-col">
        <div class="p-6 border-b flex justify-between items-center">
            <h2 class="font-bold uppercase">Your Bag</h2>
            <button onclick="window.toggleCart()" class="material-symbols-outlined">close</button>
        </div>
        <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
        <div class="p-6 border-t">
            <div class="flex justify-between mb-4 font-bold"><span>Total</span><span id="cart-total" class="text-orange-500">$0</span></div>
            <button onclick="alert('Checkout integration coming next!')" class="w-full bg-orange-500 text-white py-4 rounded font-bold uppercase">Checkout</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyDyC4uyc10cXAFOESh4DSUSPXJN4EgVy_I",
            authDomain: "obasty-market.firebaseapp.com",
            projectId: "obasty-market",
            storageBucket: "obasty-market.firebasestorage.app",
            messagingSenderId: "753490577388",
            appId: "1:753490577388:web:b091a8f4ba9d88c0e662c9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const productsRef = collection(db, "products");

        let cart = [];
        window.isLoggedIn = false;

        // AUTH STATE
        onAuthStateChanged(auth, (user) => {
            window.isLoggedIn = !!user;
            if(user) {
                document.getElementById('user-display').innerText = user.email.split('@')[0];
            } else {
                document.getElementById('user-display').innerText = "Account";
            }
        });

        // UI TOGGLES
        window.toggleModal = () => document.getElementById('profile-modal').classList.toggle('hidden');
        window.toggleSellModal = () => document.getElementById('sell-modal').classList.toggle('hidden');
        window.toggleCart = () => {
            document.getElementById('cart-sidebar').classList.toggle('translate-x-full');
            document.getElementById('cart-overlay').classList.toggle('hidden');
        };
        window.showForm = (view) => {
            document.getElementById('auth-selection').style.display = view === 'selection' ? 'block' : 'none';
            document.getElementById('login-form').style.display = view === 'login' ? 'block' : 'none';
            document.getElementById('signup-form').style.display = view === 'signup' ? 'block' : 'none';
        };

        // FIREBASE AUTH ACTIONS
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const [email, pass] = e.target.querySelectorAll('input');
            try { await signInWithEmailAndPassword(auth, email.value, pass.value); window.toggleModal(); } 
            catch(err) { alert(err.message); }
        };

        document.getElementById('signupForm').onsubmit = async (e) => {
            e.preventDefault();
            const [email, pass] = e.target.querySelectorAll('input');
            try { await createUserWithEmailAndPassword(auth, email.value, pass.value); window.toggleModal(); } 
            catch(err) { alert(err.message); }
        };

        // FIREBASE SELL ACTION
        document.getElementById('sellForm').onsubmit = async (e) => {
            e.preventDefault();
            if(!window.isLoggedIn) return alert("Please Login First");
            const product = {
                name: document.getElementById('sellerProductName').value,
                price: parseFloat(document.getElementById('sellerProductPrice').value),
                category: document.getElementById('sellerProductCategory').value,
                image: document.getElementById('sellerProductImage').value,
                createdAt: Date.now()
            };
            await addDoc(productsRef, product);
            window.toggleSellModal();
            e.target.reset();
        };

        // REAL-TIME SYNC
        const q = query(productsRef, orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            snapshot.forEach(doc => {
                const p = doc.data();
                const div = document.createElement('div');
                div.className = "product-card p-2 bg-white rounded-lg shadow-sm border border-transparent hover:border-orange-200 transition";
                div.setAttribute('data-name', p.name.toLowerCase());
                div.setAttribute('data-category', p.category);
                div.innerHTML = `
                    <img src="${p.image}" class="w-full aspect-square object-cover rounded mb-2">
                    <h3 class="text-xs font-bold truncate">${p.name}</h3>
                    <p class="text-orange-500 font-black text-lg">$${p.price}</p>
                    <button onclick="window.checkAuthAndAdd('${p.name}', ${p.price})" class="w-full bg-orange-500 text-white py-2 rounded text-[10px] font-bold uppercase mt-2">Add to Cart</button>
                `;
                grid.appendChild(div);
            });
        });

        // CART LOGIC
        window.checkAuthAndAdd = (name, price) => {
            if(!window.isLoggedIn) return window.toggleModal();
            cart.push({name, price});
            updateCartUI();
        };

        function updateCartUI() {
            const list = document.getElementById('cart-items');
            document.getElementById('cart-count').innerText = cart.length;
            let total = 0;
            list.innerHTML = cart.map((item, i) => {
                total += item.price;
                return `<div class="flex justify-between items-center bg-gray-50 p-2 rounded">
                    <span class="text-xs font-bold">${item.name}</span>
                    <span class="text-orange-500 font-bold">$${item.price}</span>
                </div>`;
            }).join('');
            document.getElementById('cart-total').innerText = '$' + total;
        }

        window.checkAuthAndSell = () => window.isLoggedIn ? window.toggleSellModal() : window.toggleModal();

        // UTILITIES
        window.searchProducts = () => {
            const val = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.product-card').forEach(card => {
                card.style.display = card.getAttribute('data-name').includes(val) ? 'block' : 'none';
            });
        };

        window.filterCat = (cat) => {
            document.querySelectorAll('.product-card').forEach(card => {
                card.style.display = (cat === 'all' || card.getAttribute('data-category') === cat) ? 'block' : 'none';
            });
        };

        // TIMER
        setInterval(() => {
            const time = new Date().toLocaleTimeString();
            document.getElementById('timer').innerText = time;
        }, 1000);

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanaObasty | Ultra-Premium Marketplace</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366F1; --secondary: #A855F7; --bg: #020617;
            --glass: rgba(15, 23, 42, 0.7); --border: rgba(255, 255, 255, 0.1);
            --text: #F8FAFC; --accent: #22C55E; --card-bg: rgba(30, 41, 59, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

        /* --- Animated Neural Background --- */
        .neural-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(168, 85, 247, 0.15) 0%, transparent 40%);
            z-index: -1; filter: blur(60px); animation: pulse 10s infinite alternate;
        }
        @keyframes pulse { from { opacity: 0.5; } to { opacity: 1; } }

        /* --- Glass Nav --- */
        nav {
            position: sticky; top: 15px; margin: 0 5%;
            background: var(--glass); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border); border-radius: 24px;
            padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; z-index: 1000;
        }
        .logo { font-weight: 800; font-size: 1.5rem; background: linear-gradient(to right, #818CF8, #C084FC); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* --- Modern Grid Layout --- */
        .container { padding: 40px 5%; max-width: 1400px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }

        /* --- Pro Card with Hover Parallax --- */
        .pro-card {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 32px;
            padding: 16px; transition: 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative; overflow: hidden;
        }
        .pro-card:hover { transform: scale(1.03) translateY(-10px); border-color: var(--primary); background: rgba(255,255,255,0.05); }

        .image-container {
            height: 220px; border-radius: 24px; overflow: hidden; position: relative;
            cursor: crosshair;
        }
        .image-container img { 
            width: 100%; height: 100%; object-fit: cover; 
            transition: transform 0.2s ease-out; /* For the manual 360-style zoom */
        }
        .image-container:hover img { transform: scale(1.4); }

        .price-badge {
            position: absolute; top: 15px; left: 15px;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px);
            padding: 6px 14px; border-radius: 12px; font-weight: 800; color: #fff;
        }

        /* --- In-App Chat Widget --- */
        .chat-widget {
            position: fixed; bottom: 110px; right: 30px;
            width: 320px; height: 400px; background: var(--glass);
            backdrop-filter: blur(25px); border: 1px solid var(--border);
            border-radius: 24px; display: none; flex-direction: column;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); z-index: 1001;
            animation: slideIn 0.3s ease;
        }
        .chat-header { padding: 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        .chat-body { flex: 1; padding: 15px; overflow-y: auto; font-size: 0.85rem; }
        .msg { background: rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 12px; margin-bottom: 10px; width: fit-content; }
        .msg.me { background: var(--primary); align-self: flex-end; margin-left: auto; }

        /* --- Floating Action Hub --- */
        .action-hub { position: fixed; bottom: 30px; right: 30px; display: flex; gap: 15px; z-index: 1000; }
        .btn-round {
            width: 60px; height: 60px; border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s; color: white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .btn-chat { background: #3B82F6; }
        .btn-sell { background: linear-gradient(135deg, var(--primary), var(--secondary)); font-size: 24px; }
        .btn-round:hover { transform: scale(1.1) rotate(10deg); }

        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    </style>
</head>
<body>

    <div class="neural-bg"></div>

    <nav>
        <div class="logo">NanaObasty</div>
        <div style="display:flex; gap:20px; align-items:center;">
            <div style="font-size: 0.75rem; font-weight: 600; color: var(--accent);">
                <span style="animation: blink 1s infinite;">●</span> Live: 1,402 Active Ads
            </div>
            <div id="pfp" style="width:35px; height:35px; border-radius:10px; background:var(--primary); display:flex; align-items:center; justify-content:center; cursor:pointer;">👤</div>
        </div>
    </nav>

    <div class="container">
        <header style="margin-bottom: 50px; text-align: center;">
            <h1 style="font-size: 3.5rem; font-weight: 800; letter-spacing: -2px; margin-bottom: 10px;">Marketplace <span style="color: var(--primary);">Redefined.</span></h1>
            <p style="color: #94A3B8; font-size: 1.1rem;">Secure, verified, and blazing fast trade in the heart of Ghana.</p>
        </header>

        <div class="grid" id="productGrid">
            </div>
    </div>

    <div class="chat-widget" id="chatBox">
        <div class="chat-header">
            <b>Live Support</b>
            <span onclick="toggleChat()" style="cursor:pointer;">✕</span>
        </div>
        <div class="chat-body" id="chatFlow">
            <div class="msg">Welcome to NanaObasty! How can we help you today?</div>
        </div>
        <div style="padding: 10px; border-top: 1px solid var(--border);">
            <input type="text" placeholder="Type a message..." style="width:100%; background:none; border:none; color:white; outline:none;">
        </div>
    </div>

    <div class="action-hub">
        <button class="btn-round btn-chat" onclick="toggleChat()">💬</button>
        <button class="btn-round btn-sell" onclick="alert('Sell Modal')">+</button>
    </div>

    <script>
        const products = [
            { id: 1, name: "MacBook Pro M3", price: "₵28,000", img: "https://images.unsplash.com/photo-1517336714731-489689fd1ca8?q=80&w=600" },
            { id: 2, name: "AirPods Max", price: "₵8,500", img: "https://images.unsplash.com/photo-1613040809024-b4ef7ba99bc3?q=80&w=600" },
            { id: 3, name: "Luxury Villa - East Legon", price: "₵4.2M", img: "https://images.unsplash.com/photo-1613490493576-7fde63acd811?q=80&w=600" },
            { id: 4, name: "BMW M4 Competition", price: "₵1.2M", img: "https://images.unsplash.com/photo-1555215695-3004980ad54e?q=80&w=600" }
        ];

        const grid = document.getElementById('productGrid');
        
        // Render with Image Parallax Logic
        grid.innerHTML = products.map(p => `
            <div class="pro-card">
                <div class="image-container" onmousemove="zoomEffect(event)" onmouseleave="resetZoom(event)">
                    <span class="price-badge">${p.price}</span>
                    <img src="${p.img}">
                </div>
                <div style="margin-top:20px;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h3 style="font-size:1.1rem; font-weight:700;">${p.name}</h3>
                        <span style="font-size:0.7rem; color:var(--accent);">✓ Verified</span>
                    </div>
                    <p style="font-size:0.8rem; color:#94A3B8; margin:8px 0 15px;">Accra, Ghana • 2 mins ago</p>
                    <button style="width:100%; padding:12px; border-radius:15px; border:1px solid var(--border); background:rgba(255,255,255,0.05); color:white; font-weight:700; cursor:pointer; transition:0.3s;" onmouseover="this.style.background='var(--primary)'" onmouseout="this.style.background='rgba(255,255,255,0.05)'">Contact Seller</button>
                </div>
            </div>
        `).join('');

        // Manual Image Pan Effect (Pro feel)
        window.zoomEffect = (e) => {
            const img = e.currentTarget.querySelector('img');
            const rect = e.currentTarget.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * 100;
            const y = ((e.clientY - rect.top) / rect.height) * 100;
            img.style.transformOrigin = `${x}% ${y}%`;
            img.style.transform = "scale(1.8)";
        };

        window.resetZoom = (e) => {
            const img = e.currentTarget.querySelector('img');
            img.style.transform = "scale(1)";
        };

        window.toggleChat = () => {
            const chat = document.getElementById('chatBox');
            chat.style.display = chat.style.display === 'flex' ? 'none' : 'flex';
        };

    </script>

    <style>
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</body>
</html>

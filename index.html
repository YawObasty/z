<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>NANA OBASTY ELITE | Luxury Marketplace</title>
    
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,1&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #C5A059; --dark: #121212; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0d0d0d; color: #fff; }
        .gold-text { color: var(--accent); }
        .bg-gold { background: var(--accent); }
        .glass-nav { background: rgba(18, 18, 18, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid #222; }
        .product-card { background: #1a1a1a; border: 1px solid #222; transition: all 0.4s ease; border-radius: 20px; overflow: hidden; position: relative; }
        .product-card:hover { border-color: var(--accent); transform: translateY(-10px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        #detail-overlay { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateY(100%); }
        #detail-overlay.active { transform: translateY(0); display: flex; }
    </style>
</head>
<body>

    <div id="detail-overlay" class="fixed inset-0 bg-[#0d0d0d] z-[3000] hidden flex flex-col overflow-y-auto">

                    </div>

                    <div class="bg-[#161616] p-6 rounded-3xl border border-white/5 space-y-4">

                        <a id="detail-wa-btn" href="#" target="_blank" class="w-full border border-white/10 text-white py-5 rounded-2xl font-black uppercase text-xs flex items-center justify-center gap-3 transition hover:bg-white hover:text-black">

                    </div>
                </div>

            <div class="mt-24 border-t border-white/5 pt-12 pb-20">

                <div id="similar-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>
            </div>
        </div>
    </div>

    <nav class="glass-nav sticky top-0 z-[100] px-6 py-4">
        <div class="container mx-auto flex justify-between items-center">
            <a href="#" class="text-2xl font-black tracking-tighter">

            </a>
            <div class="flex items-center space-x-6">

                <span class="material-symbols-outlined text-2xl">shopping_cart</span>
            </div>
        </div>
    </nav>

    </main>
